        { k:"c", who:"山本 明彦", at:"5/12 10:00", body:"開催案内を受領しました。今年は11/8です。" },
        { k:"c", who:"山本 明彦", at:"6/28 15:58", body:"参加申込を提出しました。発表枠も確保しています。" },
        { k:"e", who:"山本 明彦", at:"6/28 16:00", body:"状態を 処理中 → 完了 に変更しました" }
      ] }
  ]
};

let S = load();
let filter = "all";
let faqQuery = "";

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(structuredClone(SEED), JSON.parse(raw)); }
  catch (e) {}
  return structuredClone(SEED);
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ── helpers ───────────────────────────────── */
const DOW = ["日","月","火","水","木","金","土"];
const d      = s => new Date(s + "T00:00:00");
const md     = s => (d(s).getMonth() + 1) + "/" + d(s).getDate();
const dow    = s => DOW[d(s).getDay()];
const daysTo = s => Math.round((d(s) - TODAY) / 86400000);
function stamp(){
  const n = new Date();
  return `${TODAY.getMonth() + 1}/${TODAY.getDate()} ${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`;
}
const who = () => S.role === "operator" ? "山本 明彦" : S.me.name;

const joined = sl => sl.people.includes("あなた");
const left   = sl => Math.max(0, sl.cap - sl.people.length);
function phase(sl){
  if (sl.state === "tbd")  return "tbd";
  if (sl.state === "done") return "done";
  return left(sl) === 0 && !joined(sl) ? "full" : "open";
}
const cancelable = sl => daysTo(sl.date) > 7;   // 取り消し期限＝活動日の1週間前

function toast(msg){
  const t = document.getElementById("toast");
  t.firstElementChild.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = "0"; }, 2200);
}

const TONE = {
  soil:"border-soil/30 bg-soil/8 text-soil", plain:"border-line2 text-ink2",
  mute:"border-line2 text-muted", dash:"border-dashed border-line2 text-muted",
  pine:"border-pine/25 bg-pine/8 text-pine"
};
const pill = (label, tone, dot = false) => `
  <span class="inline-flex items-center gap-1.5 whitespace-nowrap px-2.5 py-1 rounded-full border ${TONE[tone]} font-mono text-[10.5px]">
    ${dot ? '<span class="w-1.5 h-1.5 rounded-full bg-pine"></span>' : ""}${esc(label)}
  </span>`;

function slotPill(sl){
  const p = phase(sl);
  if (p === "tbd")  return pill("調整中", "dash");
  if (p === "done") return pill("終了", "mute");
  if (p === "full") return pill("満枠", "mute");
  if (joined(sl))   return pill("参加予定", "pine", true);
  const n = left(sl);
  return pill(`あと${n}枠`, n <= 2 ? "soil" : "plain");
}

/* 議題の状態（Backlog型の3値） */
const ST = { todo:{ label:"未対応", tone:"soil" }, doing:{ label:"処理中", tone:"plain", dot:true }, done:{ label:"完了", tone:"mute" } };
const statePill = k => pill(ST[k].label, ST[k].tone, !!ST[k].dot);

/* ── 活動：一覧 ────────────────────────────── */
function activityList(){
  const live = S.slots.filter(s => s.state !== "done").sort((a, b) => d(a.date) - d(b.date));
  const past = S.slots.filter(s => s.state === "done").sort((a, b) => d(b.date) - d(a.date));
  const counts = { all:live.length, open:live.filter(s=>phase(s)==="open").length,
                   full:live.filter(s=>phase(s)==="full").length, tbd:live.filter(s=>phase(s)==="tbd").length };
  const shown = live.filter(s => filter === "all" || phase(s) === filter);
  const mine  = live.filter(joined);

  const tabBtn = (k, label) => `
    <button data-act="filter" data-k="${k}" class="relative px-3 py-2.5 text-[12.5px] whitespace-nowrap ${filter===k?"text-ink":"text-muted"}">
      ${label} <span class="font-mono text-[10.5px] ml-0.5 tnum">${counts[k]}</span>
      ${filter===k?'<span class="absolute inset-x-0 -bottom-px h-[2px] bg-pine"></span>':""}
    </button>`;

  return `
  <div class="fade">
    <div class="px-5 sm:px-6 pt-7 pb-5">
      <p class="font-mono text-[9.5px] tracking-[.2em] text-muted uppercase">Activity</p>
      <h1 class="font-min text-[23px] mt-2">次の活動</h1>
      ${mine.length
        ? `<p class="mt-3 text-[12px] text-ink2">${md(mine[0].date)}（${dow(mine[0].date)}）に参加予定です。</p>`
        : `<p class="mt-3 text-[12px] text-muted">まだ応募している活動はありません。</p>`}
    </div>
    <div class="px-5 sm:px-6 flex gap-1 border-b border-line overflow-x-auto">
      ${tabBtn("all","すべて")}${tabBtn("open","空きあり")}${tabBtn("full","満枠")}${tabBtn("tbd","調整中")}
    </div>
    <ul class="px-5 sm:px-6 divide-y divide-line">
      ${shown.length ? shown.map(slotRow).join("") : `
        <li class="py-10 text-center">
          <p class="text-[13px] text-ink2">この条件の予定はありません。</p>
          <button data-act="filter" data-k="all" class="mt-3 text-[12px] text-pine underline underline-offset-4">すべての予定を見る</button>
        </li>`}
    </ul>
    ${past.length ? `
    <details class="px-5 sm:px-6 mt-2 border-t border-line">
      <summary class="py-4 text-[12px] text-muted cursor-pointer list-none flex items-center justify-between">
        <span>過去の記録 <span class="font-mono tnum">${past.length}</span></span><span class="font-mono text-[10px]">開く</span>
      </summary>
      <ul class="divide-y divide-line">${past.map(slotRow).join("")}</ul>
      <p class="py-5 text-[11px] text-muted leading-relaxed">終わった活動は一覧から畳んでいます。画面の情報量は、時間とともに増えません。</p>
    </details>` : ""}
    <div class="h-8"></div>
  </div>`;
}

function slotRow(sl){
  const p = phase(sl);
  const sel = S.detail === sl.id ? "bg-paper2/70" : "";
  const dim = (p === "done" || p === "full") ? "opacity-60" : "";
  const label = p === "tbd" ? `${d(sl.date).getMonth()+1}月上旬`
    : `${md(sl.date)}<span class="text-[11px] text-muted ml-1.5">${dow(sl.date)}</span>`;
  const ok = p !== "tbd";
  return `
  <li>
    <button data-act="${ok ? "open" : "noop"}" data-id="${esc(sl.id)}"
      class="w-full text-left py-4 flex items-center gap-3 ${dim} ${sel} ${ok?"hover:bg-paper2/50":"cursor-default"} -mx-2 px-2 rounded transition-colors">
      <span class="font-min text-[17px] tnum w-[4.6rem] shrink-0">${label}</span>
      <span class="flex-1 text-[13px] text-ink2 truncate">${esc(sl.title)}</span>
      <span class="shrink-0">${slotPill(sl)}</span>
    </button>
  </li>`;
}

/* ── 活動：詳細 ────────────────────────────── */
const row = (k, v) => v ? `<div class="flex gap-4"><dt class="w-[4.5rem] shrink-0 text-muted">${k}</dt><dd class="text-ink">${v}</dd></div>` : "";

function activityDetail(){
  const sl = S.slots.find(s => s.id === S.detail);
  if (!sl) return emptyPane("左の一覧から活動を選んでください。");
  const p = phase(sl), me = joined(sl);
  const next = S.slots.filter(s => s.id !== sl.id && phase(s) === "open").sort((a,b)=>d(a.date)-d(b.date))[0];

  let action;
  if (p === "done") {
    action = `<div class="mt-7 py-3 text-center text-[12.5px] text-muted border border-line rounded-md">終了した活動です</div>`;
  } else if (me) {
    action = `
      <button data-act="cancel" data-id="${esc(sl.id)}" class="mt-7 w-full py-3 rounded-md border border-line2 text-[13.5px] text-ink2 hover:border-muted transition-colors">枠を取り消す</button>
      <p class="mt-3 text-center text-[11px] text-muted leading-relaxed">
        ${cancelable(sl) ? "活動日の1週間前まで、いつでも取り消せます。"
                         : "期限を過ぎています。取り消すと運営に通知が届きます。個別の連絡は不要です。"}</p>`;
  } else if (p === "full") {
    action = `
      <div class="mt-7 py-3 text-center text-[12.5px] text-muted border border-line rounded-md">満枠です</div>
      ${next ? `<button data-act="open" data-id="${esc(next.id)}" class="mt-3 w-full py-3 rounded-md bg-pine text-paper text-[13.5px] hover:bg-pine2 transition-colors">
        次に空きがある ${md(next.date)}（${dow(next.date)}）を見る</button>` : ""}`;
  } else {
    action = `
      <button data-act="apply" data-id="${esc(sl.id)}" class="mt-7 w-full py-3.5 rounded-md bg-pine text-paper text-[14px] hover:bg-pine2 transition-colors">枠を押さえる</button>
      <p class="mt-3 text-center text-[11px] text-muted">1週間前まで、いつでも取り消せます。</p>`;
  }

  return `
  <div class="fade">
    <div class="px-5 sm:px-6 pt-5 pb-2 lg:hidden">
      <button data-act="back" class="font-mono text-[11px] text-muted hover:text-ink transition-colors">← 一覧へ</button>
    </div>
    <div class="px-5 sm:px-6 lg:px-10 pb-10 lg:pt-9 max-w-[560px]">
      <div class="flex items-start justify-between gap-4 mt-3 lg:mt-0">
        <div>
          <p class="font-mono text-[10px] tracking-[.18em] text-muted uppercase">${dow(sl.date)}</p>
          <p class="font-min text-[34px] leading-none mt-1.5 tnum">
            ${d(sl.date).getMonth()+1}<span class="text-[20px] mx-0.5">月</span>${d(sl.date).getDate()}<span class="text-[20px] ml-0.5">日</span></p>
        </div>
        <div class="shrink-0 mt-1">${slotPill(sl)}</div>
      </div>
      <hr class="my-6 border-line">
      <dl class="space-y-4 text-[13.5px]">
        ${row("作業", esc(sl.title))}
        ${row("集合", esc(sl.meet))}
        ${row("持ち物", esc(sl.gear))}
        ${row("定員", `<span class="tnum">${sl.cap}名</span><span class="text-muted"> / 応募 <span class="tnum">${sl.people.length}名</span></span>`)}
        ${row("あと", daysTo(sl.date) > 0 ? `<span class="tnum">${daysTo(sl.date)}日</span>` : "")}
      </dl>
      ${sl.note ? `<p class="mt-6 p-4 rounded-md bg-paper2/60 border border-line text-[12.5px] leading-[1.9] text-ink2">${esc(sl.note)}</p>` : ""}
      ${action}
      <p class="mt-8 pt-5 border-t border-line font-mono text-[10px] text-muted">更新 ${esc(sl.updated)}</p>
      <p class="mt-2 text-[11px] text-muted leading-relaxed">誰が応募しているかは表示していません。参加歴で気後れしないためです。</p>
    </div>
  </div>`;
}

/* ── 議題：一覧（Backlog型） ───────────────── */
function threadList(){
  const order = { todo:0, doing:1, done:2 };
  const open = S.threads.filter(t => t.state !== "done").sort((a,b)=>order[a.state]-order[b.state]);
  const done = S.threads.filter(t => t.state === "done");

  return `
  <div class="fade">
    <div class="px-5 sm:px-6 pt-7 pb-5 flex items-start justify-between gap-4">
      <div>
        <p class="font-mono text-[9.5px] tracking-[.2em] text-muted uppercase">Threads</p>
        <h1 class="font-min text-[23px] mt-2">議題</h1>
        <p class="mt-3 text-[12px] text-ink2 leading-[1.9]">議題ごとに文脈を閉じています。<br class="lg:hidden">決まったことは、常にいちばん上にあります。</p>
      </div>
      ${S.role === "operator" ? `<button data-act="newThread" class="shrink-0 px-3.5 py-2 rounded-md bg-pine text-paper text-[12px] hover:bg-pine2 transition-colors">＋ 追加</button>` : ""}

      </summary>
      <ul class="divide-y divide-line">${done.map(threadRow).join("")}</ul>
    </details>` : ""}
    <div class="h-8"></div>
  </div>`;
}

function threadRow(t){
  const sel = S.thread === t.id ? "bg-paper2/70" : "";

}

}

              <span class="font-min text-[15px] tnum shrink-0">${md(s.date)}<span class="text-[11px] text-muted ml-1.5">${dow(s.date)}</span></span>
              <span class="flex-1 text-[12.5px] text-ink2 truncate">${esc(s.title)}</span>
              <span class="font-mono text-[10px] text-muted">→</span></button></li>`).join("")}</ul>`
        : `<p class="mt-3 text-[12.5px] text-ink2">まだありません。</p>
           <button data-act="go" data-tab="activity" class="mt-3 text-[12px] text-pine underline underline-offset-4">次の活動を見る</button>`}
      </div>
    </div>

    <div class="mt-4 rounded-[10px] border border-line bg-card p-5">
      <p class="text-[12.5px] text-muted">できること</p>
      <div class="mt-3 flex flex-wrap gap-2">
        ${S.me.skills.map((s,i)=>`
          <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md border border-line2 text-[12px]">
            ${esc(s)}<button data-act="skillDel" data-i="${i}" class="text-muted hover:text-soil" aria-label="削除">×</button></span>`).join("")}
      </div>
      <form data-act="skillAdd" class="mt-4 flex gap-2 max-w-[420px]">
        <input name="skill" placeholder="例：チェンソー" maxlength="40"
          class="flex-1 px-3 py-2 rounded-md border border-line2 bg-paper/60 text-[12.5px] outline-none focus:border-pine transition-colors">
        <button class="px-4 py-2 rounded-md bg-pine text-paper text-[12.5px] hover:bg-pine2 transition-colors">追加</button>
      </form>
      <p class="mt-3 text-[11px] text-muted leading-relaxed">運営が人員を組むときに使います。毎回の自己紹介をなくすためのものです。</p>
    </div>

    <p class="mt-6 text-[11px] text-muted leading-relaxed">累計の参加回数は、他の参加者には表示していません。参加歴で序列を作らないためです。</p>
  </div>`;
}

function viewFaq(){
  const list = S.faq.filter(f => !faqQuery || (f.q + f.a).includes(faqQuery));
  return `
  <div class="fade px-5 sm:px-6 lg:px-10 pt-7 lg:pt-9 pb-10 max-w-[720px]">
    <p class="font-mono text-[9.5px] tracking-[.2em] text-muted uppercase">FAQ</p>
    <h1 class="font-min text-[23px] mt-2">よくある質問</h1>
    <p class="mt-3 text-[12px] text-ink2 leading-[1.9]">聞きにくいことほど、ここに置いてあります。</p>
    <input data-act="faqSearch" value="${esc(faqQuery)}" placeholder="キーワードで探す" maxlength="40"
      class="mt-5 w-full max-w-[420px] px-3.5 py-2.5 rounded-md border border-line2 bg-card text-[13px] outline-none focus:border-pine transition-colors">
    <div class="mt-4 divide-y divide-line border-t border-line">
      ${list.length ? list.map(f=>`
        <details class="group">
          <summary class="py-4 flex items-start justify-between gap-4 cursor-pointer list-none">
            <span class="text-[13px] text-ink2 group-open:text-ink">${esc(f.q)}</span>
            <span class="font-mono text-[10px] text-muted shrink-0 mt-0.5">${esc(f.u)}</span>
          </summary>
          <p class="pb-5 text-[12.5px] leading-[2] text-ink2 max-w-[46rem]">${esc(f.a)}</p>
        </details>`).join("")
      : `<p class="py-8 text-[12.5px] text-muted text-center">見つかりませんでした。</p>`}
    </div>
    <div class="mt-7 p-5 rounded-[10px] border border-line bg-card max-w-[520px]">
      <p class="text-[12.5px]">ここに無いことを聞く</p>
      <p class="mt-2 text-[11.5px] leading-[1.9] text-muted">誰が聞いたかは残りません。同じ質問が続いたものは、この一覧に足していきます。</p>
      <form data-act="ask" class="mt-4 flex gap-2">
        <input name="q" placeholder="質問を書く" maxlength="100"
          class="flex-1 px-3 py-2 rounded-md border border-line2 bg-paper/60 text-[12.5px] outline-none focus:border-pine transition-colors">
        <button class="px-4 py-2 rounded-md bg-pine text-paper text-[12.5px] hover:bg-pine2 transition-colors">送る</button>
      </form>
    </div>
    <p class="mt-5 text-[11px] text-muted leading-relaxed">日付は更新日です。古い答えは、古いと分かる形で出しています。</p>
  </div>`;
}

const stat = (k, v) => `
  <div class="rounded-[10px] border border-line bg-card p-4">
    <dt class="font-mono text-[9.5px] tracking-[.14em] text-muted uppercase">${k}</dt>
    <dd class="font-min text-[22px] tnum mt-1.5 text-pine">${v}</dd></div>`;

function viewOpsActivity(){
  const live = S.slots.filter(s => s.state !== "done").sort((a,b)=>d(a.date)-d(b.date));
  const pub  = live.filter(s => s.state === "open");
  const capSum = pub.reduce((a,s)=>a+s.cap,0);
  const rate = capSum ? Math.round(pub.reduce((a,s)=>a+s.people.length,0)/capSum*100) : 0;

  return `
  <div class="fade px-5 sm:px-6 lg:px-10 pt-7 lg:pt-9 pb-10 max-w-[980px]">
    <p class="font-mono text-[9.5px] tracking-[.2em] text-muted uppercase">Operator</p>
    <h1 class="font-min text-[23px] mt-2">応募状況</h1>
    <dl class="mt-6 grid grid-cols-3 gap-3 max-w-[520px]">
      ${stat("充足率", rate+"%")}${stat("公開中", pub.length+"件")}${stat("調整中", live.filter(s=>s.state==="tbd").length+"件")}
    </dl>
    <div class="mt-6 grid md:grid-cols-2 gap-3">
      ${live.map(sl => {
        const p = phase(sl), pct = Math.min(100, Math.round(sl.people.length/sl.cap*100));
        return `
        <article class="rounded-[10px] border border-line bg-card p-5">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="font-min text-[17px] tnum">${p==="tbd" ? `${d(sl.date).getMonth()+1}月上旬`
                : `${md(sl.date)}<span class="text-[11px] text-muted ml-1">${dow(sl.date)}</span>`}</p>
              <p class="text-[12.5px] text-ink2 mt-1">${esc(sl.title)}</p>
            </div>${slotPill(sl)}
          </div>
          ${p === "tbd" ? `
            <p class="mt-4 text-[11.5px] text-muted leading-relaxed">日程が未定でも、空白にせず「調整中」として出しています。</p>
            <button data-act="fix" data-id="${esc(sl.id)}" class="mt-3 w-full py-2.5 rounded-md border border-line2 text-[12.5px] hover:border-muted transition-colors">日程を確定する</button>
          ` : `
            <div class="mt-4">
              <div class="flex items-center justify-between text-[11px] text-muted">
                <span>応募 <span class="tnum text-ink">${sl.people.length}</span> / 定員 <span class="tnum">${sl.cap}</span></span>
                <span class="font-mono tnum">${pct}%</span>
              </div>
              <div class="mt-2 h-1.5 rounded-full bg-line overflow-hidden"><div class="h-full bg-pine transition-all duration-500" style="width:${pct}%"></div></div>
              <ul class="mt-4 space-y-2">
                ${sl.people.map(n=>{ const m=S.members.find(x=>x.name===n);
                  return `<li class="flex items-center justify-between gap-3 text-[12px]"><span>${esc(n)}</span>
                    <span class="text-muted font-mono text-[10.5px] shrink-0">${m?`${m.count}回目 · ${esc(m.skills.slice(0,2).join("/")||"—")}`:"初参加"}</span></li>`;
                }).join("") || `<li class="text-[12px] text-muted">まだ応募がありません</li>`}
              </ul>
            </div>`}
          <p class="mt-4 pt-3 border-t border-line font-mono text-[10px] text-muted">更新 ${esc(sl.updated)}</p>
        </article>`;
      }).join("")}
    </div>
    <form data-act="slotAdd" class="mt-5 p-5 rounded-[10px] border border-dashed border-line2 max-w-[520px]">
      <p class="text-[12.5px]">活動日を追加</p>
      <p class="mt-1.5 text-[11px] text-muted leading-relaxed">2週間前までに立てるのが運用ルールです。立てられない場合も「調整中」として出します。</p>
      <div class="mt-3 grid sm:grid-cols-[1fr_auto] gap-2">
        <input type="date" name="date" value="2026-10-10" class="px-3 py-2 rounded-md border border-line2 bg-paper/60 text-[12.5px] outline-none focus:border-pine transition-colors">
        <input name="cap" type="number" min="1" max="30" value="5" class="w-full sm:w-20 px-3 py-2 rounded-md border border-line2 bg-paper/60 text-[12.5px] outline-none focus:border-pine transition-colors">
      </div>
      <input name="title" placeholder="作業内容（1行）" maxlength="60"
        class="mt-2 w-full px-3 py-2 rounded-md border border-line2 bg-paper/60 text-[12.5px] outline-none focus:border-pine transition-colors">
      <button class="mt-3 w-full py-2.5 rounded-md bg-pine text-paper text-[12.5px] hover:bg-pine2 transition-colors">追加する</button>
    </form>
  </div>`;
}

function viewOpsMembers(){
  return `
  <div class="fade px-5 sm:px-6 lg:px-10 pt-7 lg:pt-9 pb-10 max-w-[720px]">
    <p class="font-mono text-[9.5px] tracking-[.2em] text-muted uppercase">Operator</p>
    <h1 class="font-min text-[23px] mt-2">メンバー</h1>
    <p class="mt-3 text-[12px] text-ink2 leading-[1.9]">参加回数はこの画面にだけ出します。人員を組むのに必要なのは運営だけだからです。</p>
    <ul class="mt-6 divide-y divide-line border-t border-line">
      ${S.members.slice().sort((a,b)=>b.count-a.count).map(m=>`
        <li class="py-4 flex items-center justify-between gap-3">
          <div><p class="text-[13px]">${esc(m.name)}</p><p class="text-[11px] text-muted mt-1">${esc(m.skills.join(" / ")||"—")}</p></div>
          <div class="text-right shrink-0">
            <p class="font-min text-[17px] tnum">${m.count}<span class="text-[11px] text-muted ml-0.5">回</span></p>
            <p class="font-mono text-[10px] text-muted mt-0.5 tnum">${esc(m.last.replace(/-/g,"."))}</p></div>
        </li>`).join("")}
    </ul>
  </div>`;
}

const emptyPane = msg => `
  <div class="hidden lg:flex h-full items-center justify-center px-10">
    <p class="text-[12.5px] text-muted text-center leading-relaxed">${esc(msg)}</p>
  </div>`;

/* 一覧＋詳細の二枚組（PCは左右、スマホは切り替え） */
function split(listMarkup, detailMarkup, hasSelection){
  if (!DESK()) return hasSelection ? detailMarkup : listMarkup;
  return `
    <div class="flex h-full">
      <div class="w-[380px] xl:w-[420px] shrink-0 border-r border-line overflow-y-auto">${listMarkup}</div>
      <div class="flex-1 min-w-0 overflow-y-auto">${detailMarkup}</div>
    </div>`;
}

/* ── ナビ ──────────────────────────────────── */
const ICON = {
  activity:'<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>',
  profile: '<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c0-3.6 3.4-5.6 7.5-5.6s7.5 2 7.5 5.6"/>',
  faq:     '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3 2.4V14"/><path d="M12 17.3v.2"/>',
  threads: '<path d="M21 14.5a3 3 0 0 1-3 3H8.5L4 21V6.5a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3z"/>'
};
const TABS = {
  volunteer: [["activity","活動"], ["profile","記録"],     ["faq","FAQ"], ["threads","議題"]],
  operator:  [["activity","応募"], ["profile","メンバー"], ["faq","FAQ"], ["threads","議題"]]
};
const CRUMB = { activity:{volunteer:"次の活動",operator:"応募状況"}, profile:{volunteer:"あなたの記録",operator:"メンバー"},
                faq:{volunteer:"よくある質問",operator:"よくある質問"}, threads:{volunteer:"議題",operator:"議題"} };

/* ── 描画 ──────────────────────────────────── */
function render(){
  const ops = S.role === "operator";
  document.getElementById("roleLabel").textContent = ops ? "運営" : "参加者";
  document.getElementById("roleChip").textContent  = ops ? "Operator" : "";
  document.getElementById("crumb").textContent     = CRUMB[S.tab][S.role];

  let markup;
  if (S.tab === "activity")      markup = ops ? viewOpsActivity() : split(activityList(), activityDetail(), !!S.detail);
  else if (S.tab === "profile")  markup = ops ? viewOpsMembers()  : viewProfile();
  else if (S.tab === "faq")      markup = viewFaq();
  else                           markup = split(threadList(), threadDetail(), !!S.thread);

  const view = document.getElementById("view");
  mount(view, markup);
  view.scrollTop = 0;

  mount(document.getElementById("tabs"), TABS[S.role].map(([k,label])=>`
    <button data-act="go" data-tab="${k}" class="py-3.5 text-[11.5px] ${S.tab===k?"text-pine":"text-muted"} transition-colors">
      <span class="block">${label}</span>
      <span class="mt-1.5 block mx-auto w-6 h-[2px] rounded-full ${S.tab===k?"bg-pine":"bg-transparent"}"></span>
    </button>`).join(""));

  mount(document.getElementById("side"), TABS[S.role].map(([k,label])=>`
    <button data-act="go" data-tab="${k}"
      class="w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-[13px] transition-colors ${S.tab===k?"bg-card border border-line text-ink":"text-muted hover:text-ink hover:bg-card/60 border border-transparent"}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${S.tab===k?"text-pine":""}">${ICON[k]}</svg>
      ${label}
    </button>`).join(""));

  save();
}

/* ── イベント ──────────────────────────────── */
document.addEventListener("click", e => {
  const el = e.target.closest("button[data-act]");
  if (!el) return;
  const a = el.dataset.act;

  if (a === "go")          { S.tab = el.dataset.tab; S.detail = null; S.thread = null; render(); }
  if (a === "open")        { S.detail = el.dataset.id; S.tab = "activity"; render(); }
  if (a === "back")        { S.detail = null; render(); }
  if (a === "openThread")  { S.thread = el.dataset.id; render(); }
  if (a === "backThread")  { S.thread = null; render(); }
  if (a === "filter")      { filter = el.dataset.k; render(); }

  if (a === "apply") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl && left(sl) > 0 && !joined(sl)) { sl.people.push("あなた"); toast("枠を押さえました"); render(); }
  }
  if (a === "cancel") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl) { const late = !cancelable(sl); sl.people = sl.people.filter(p => p !== "あなた");
              toast(late ? "取り消しました。運営に通知しました" : "取り消しました"); render(); }
  }
  if (a === "fix") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl) { sl.state="open"; sl.meet="折立 6:30"; sl.gear="作業手袋"; sl.updated="8/11"; toast("日程を確定しました"); render(); }
  }
  if (a === "setState") {
    const t = S.threads.find(x => x.id === el.dataset.id), next = el.dataset.s;
    if (t && t.state !== next) {
      t.comments.push({ k:"e", who:who(), at:stamp(), body:`状態を ${ST[t.state].label} → ${ST[next].label} に変更しました` });
      t.state = next; t.updated = stamp(); toast(`状態を「${ST[next].label}」にしました`); render();
    }
  }
  if (a === "newThread") {
    const t = { id:"t"+Date.now(), key:"KUMO-"+(S.threads.length+1), title:"新しい議題", owner:"未定",
                due:"2026-12-31", state:"todo", updated:stamp(), decision:"（まだ決まっていません）", comments:[] };
    S.threads.unshift(t); S.thread = t.id; toast("議題を追加しました"); render();
  }
  if (a === "skillDel") { S.me.skills.splice(Number(el.dataset.i), 1); render(); }
  if (a === "role")     { S.role = S.role === "operator" ? "volunteer" : "operator"; S.detail = null; render(); }
  if (a === "reset")    { localStorage.removeItem(KEY); S = structuredClone(SEED); filter="all"; faqQuery=""; toast("初期状態に戻しました"); render(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-act]");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), a = f.dataset.act;

  if (a === "comment") {
    const t = S.threads.find(x => x.id === f.dataset.id);
    const body = clean(fd.get("body"), 600);
    if (t && body) {
      t.comments.push({ k:"c", who:who(), at:stamp(), body });
      t.updated = stamp(); toast("書き込みました"); render();
    }
  }
  if (a === "skillAdd") {
    const v = clean(fd.get("skill"), 40);
    if (v && !S.me.skills.includes(v)) { S.me.skills.push(v); render(); }
  }
  if (a === "ask") { if (clean(fd.get("q"), 100)) { toast("送りました。誰が聞いたかは残りません"); f.reset(); } }
  if (a === "slotAdd") {
    const date = clean(fd.get("date"), 10), title = clean(fd.get("title"), 60);
    const cap = Math.min(30, Math.max(1, Number(fd.get("cap")) || 5));
    if (/^\d{4}-\d{2}-\d{2}$/.test(date) && title) {
      S.slots.push({ id:"s"+Date.now(), date, title, meet:"折立 6:30", gear:"作業手袋", note:"", cap, people:[], state:"open", updated:"8/11" });
      toast("活動日を追加しました"); render();
    }
  }
});

document.addEventListener("input", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "faqSearch") {
    faqQuery = clean(el.value, 40);
    const pos = el.selectionStart; render();
    const next = document.querySelector('[data-act="faqSearch"]');
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  }
  if (el.dataset.act === "decEdit") {
    const t = S.threads.find(x => x.id === el.dataset.id);
    if (t) { t.decision = clean(el.value, 300); save(); }
  }
});

window.matchMedia("(min-width:1024px)").addEventListener("change", render);
render();
</script>
