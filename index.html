<script>
"use strict";

/* ────────────────────────────────────────────────
   テキストの取り扱い
   clean() … 入力境界。タグを構成できる記号を落とし、状態にはプレーンテキストしか入れない
   esc()   … 出力境界。テンプレートへの差し込みは必ずここを通す
   mount() … 生成済みマークアップの取り付け（差し込み値は上記2つで無害化済み）
   ──────────────────────────────────────────────── */
const clean = (v, max = 200) => String(v ?? "").replace(/[<>]/g, "").trim().slice(0, max);
const esc   = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const mount = (el, markup) => el.replaceChildren(document.createRange().createContextualFragment(markup));

const TODAY = new Date(2026, 7, 11); // 2026-08-11
const KEY = "kumo-mock-v2";
const DESK = () => window.matchMedia("(min-width:1024px)").matches;

const SEED = {
  role: "volunteer", tab: "activity", detail: null, thread: null,
  me: { name: "小林 大輔", since: "2019", skills: ["刈払機", "荷上げ"], history: ["2025-09-15", "2025-07-20", "2024-08-11"] },

      note:"雨天時は小屋周りの作業に振り替えます。", cap:5, people:["佐藤 健一","田中 由美","鈴木 誠"], state:"open", updated:"8/11" },

    { id:"s4", date:"2026-10-03", title:"小屋締め前の整備", meet:"", gear:"", note:"", cap:5, people:[], state:"tbd", updated:"8/02" },
    { id:"s0", date:"2026-07-25", title:"木道の点検・補修", meet:"折立 6:30", gear:"作業手袋",

    { q:"途中で参加できなくなったら？", a:"活動日の1週間前までは、この画面から取り消せます。それ以降に取り消しても、運営に通知が届くだけです。個別の連絡は不要です。", u:"7/11" },
    { q:"体力はどれくらい必要？", a:"折立から山荘まで、荷物を背負って8時間前後の行程です。日帰りの登山を通しで歩ける方であれば問題ありません。", u:"6/20" }
  ],
  threads: [
    { id:"t1", key:"KUMO-1", title:"環境省 更新手続き", owner:"山本 明彦", due:"2026-09-01", state:"doing", updated:"8/05 14:20",
      decision:"9/1までに書類一式を提出。担当は山本、様式は昨年と同じものを使う。",
      comments:[
        { k:"c", who:"山本 明彦", at:"7/20 09:12", body:"昨年の様式がそのまま使えるか、環境省に問い合わせました。回答待ちです。" },
        { k:"c", who:"山本 明彦", at:"7/24 17:40", body:"使えるとの回答をもらいました。様式は昨年のものを流用します。" },
        { k:"e", who:"山本 明彦", at:"7/24 17:41", body:"状態を 未対応 → 処理中 に変更しました" },
        { k:"c", who:"佐藤 健一", at:"7/28 20:05", body:"添付する活動実績、去年は延べ人数だけでしたが今年は作業種別も入れたほうがいいと思います。整備と荷上げで性質が違うので。" },
        { k:"c", who:"山本 明彦", at:"8/05 14:20", body:"賛成です。作業種別で分けて集計します。数字はこちらで出します。" }
      ] },
    { id:"t2", key:"KUMO-2", title:"アニュアルレポート", owner:"山本 明彦", due:"2026-10-31", state:"doing", updated:"8/01 11:03",
      decision:"構成案を10月末までに確定。ボランティア活動は延べ人数と作業種別で載せる。",
      comments:[
        { k:"c", who:"山本 明彦", at:"7/15 08:30", body:"昨年版の反省点を整理しました。写真が少なく、活動の様子が伝わりにくいという指摘がありました。" },
        { k:"e", who:"山本 明彦", at:"7/15 08:31", body:"状態を 未対応 → 処理中 に変更しました" },
        { k:"c", who:"田中 由美", at:"8/01 11:03", body:"7月の活動で撮った写真がいくつかあります。使えそうなら送ります。" }
      ] },
    { id:"t3", key:"KUMO-3", title:"資材の追加発注", owner:"未定", due:"2026-08-31", state:"todo", updated:"8/09 19:45",
      decision:"（まだ決まっていません）",
      comments:[
        { k:"c", who:"鈴木 誠", at:"8/09 19:45", body:"9/26の荷上げ分、階段材が足りるか確認したほうがよさそうです。前回の残りが少なかった記憶があります。" }
      ] },
    { id:"t4", key:"KUMO-4", title:"登山道整備サミット", owner:"山本 明彦", due:"2026-06-30", state:"done", updated:"6/28 16:00",
      decision:"11/8の本会に参加。2名を派遣し、雲ノ平の事例を発表する。",
      comments:[
        { k:"c", who:"山本 明彦", at:"5/12 10:00", body:"開催案内を受領しました。今年は11/8です。" },
        { k:"c", who:"山本 明彦", at:"6/28 15:58", body:"参加申込を提出しました。発表枠も確保しています。" },
        { k:"e", who:"山本 明彦", at:"6/28 16:00", body:"状態を 処理中 → 完了 に変更しました" }
      ] }
  ]
};

let S = load();
let filter = "all";
let faqQuery = "";

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(structuredClone(SEED), JSON.parse(raw)); }
  catch (e) {}
  return structuredClone(SEED);
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ── helpers ───────────────────────────────── */
const DOW = ["日","月","火","水","木","金","土"];
const d      = s => new Date(s + "T00:00:00");
const md     = s => (d(s).getMonth() + 1) + "/" + d(s).getDate();
const dow    = s => DOW[d(s).getDay()];
const daysTo = s => Math.round((d(s) - TODAY) / 86400000);
function stamp(){
  const n = new Date();
  return `${TODAY.getMonth() + 1}/${TODAY.getDate()} ${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`;
}
const who = () => S.role === "operator" ? "山本 明彦" : S.me.name;

const joined = sl => sl.people.includes("あなた");
const left   = sl => Math.max(0, sl.cap - sl.people.length);
function phase(sl){
  if (sl.state === "tbd")  return "tbd";
  if (sl.state === "done") return "done";
  return left(sl) === 0 && !joined(sl) ? "full" : "open";
}
const cancelable = sl => daysTo(sl.date) > 7;   // 取り消し期限＝活動日の1週間前

function toast(msg){
  const t = document.getElementById("toast");
  t.firstElementChild.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = "0"; }, 2200);
}

const TONE = {
  soil:  "border-soil/35 bg-soil/[.07] text-soil",
  plain: "border-line2 text-ink2",
  mute:  "border-line2 text-muted",
  dash:  "border-dashed border-line2 text-muted",
  pine:  "border-pine/30 bg-pine/[.07] text-pine"
};
const pill = (label, tone, dot = false) => `
  <span class="inline-flex items-center gap-1.5 whitespace-nowrap px-2.5 py-1 rounded-full border ${TONE[tone]} font-mono text-[10.5px]">
    ${dot ? '<span class="w-1.5 h-1.5 rounded-full bg-pine"></span>' : ""}${esc(label)}
  </span>`;

function slotPill(sl){
  const p = phase(sl);
  if (p === "tbd")  return pill("調整中", "dash");
  if (p === "done") return pill("終了", "mute");
  if (p === "full") return pill("満枠", "mute");
  if (joined(sl))   return pill("参加予定", "pine", true);
  const n = left(sl);
  return pill(`あと${n}枠`, n <= 2 ? "soil" : "plain");
}

/* 議題の状態（Backlog型の3値） */
const ST = { todo:{ label:"未対応", tone:"soil" }, doing:{ label:"処理中", tone:"plain", dot:true }, done:{ label:"完了", tone:"mute" } };
const statePill = k => pill(ST[k].label, ST[k].tone, !!ST[k].dot);

/* ── 活動：一覧 ────────────────────────────── */
function activityList(){
  const live = S.slots.filter(s => s.state !== "done").sort((a, b) => d(a.date) - d(b.date));
  const past = S.slots.filter(s => s.state === "done").sort((a, b) => d(b.date) - d(a.date));
  const counts = { all:live.length, open:live.filter(s=>phase(s)==="open").length,
                   full:live.filter(s=>phase(s)==="full").length, tbd:live.filter(s=>phase(s)==="tbd").length };
  const shown = live.filter(s => filter === "all" || phase(s) === filter);
  const mine  = live.filter(joined);

  const tabBtn = (k, label) => `
    <button data-act="filter" data-k="${k}" class="relative px-3 py-2.5 text-[12.5px] whitespace-nowrap transition-colors ${filter===k?"text-ink":"text-muted hover:text-ink2"}">
      ${label} <span class="font-mono text-[10.5px] ml-0.5 tnum">${counts[k]}</span>
      ${filter===k?'<span class="absolute inset-x-3 -bottom-px h-[2px] bg-soil"></span>':""}
    </button>`;

  return `
  <div class="fade">
    <div class="px-5 sm:px-7 pt-8 pb-5">
      <p class="font-mono text-[9px] tracking-[.28em] text-muted uppercase">Activity</p>
      <h1 class="font-min text-[25px] mt-2.5">次の活動</h1>
      ${mine.length
        ? `<p class="mt-3 text-[12px] text-ink2">${md(mine[0].date)}（${dow(mine[0].date)}）に参加予定です。</p>`
        : `<p class="mt-3 text-[12px] text-muted">まだ応募している活動はありません。</p>`}
    </div>

    <div class="px-5 sm:px-7 flex gap-1 border-b border-line overflow-x-auto">
      ${tabBtn("all","すべて")}${tabBtn("open","空きあり")}${tabBtn("full","満枠")}${tabBtn("tbd","調整中")}
    </div>

    <ul class="px-5 sm:px-7 divide-y divide-line">
      ${shown.length ? shown.map(slotRow).join("") : `
        <li class="py-10 text-center">
          <p class="text-[13px] text-ink2">この条件の予定はありません。</p>
          <button data-act="filter" data-k="all" class="mt-3 text-[12px] text-pine underline underline-offset-4">すべての予定を見る</button>
        </li>`}
    </ul>

    ${past.length ? `
    <details class="px-5 sm:px-7 mt-2 border-t border-line">
      <summary class="py-4 text-[12px] text-muted cursor-pointer list-none flex items-center justify-between">
        <span>過去の記録 <span class="font-mono tnum">${past.length}</span></span><span class="font-mono text-[10px]">開く</span>
      </summary>
      <ul class="divide-y divide-line">${past.map(slotRow).join("")}</ul>
      <p class="py-5 text-[11px] text-muted leading-relaxed">終わった活動は一覧から畳んでいます。画面の情報量は、時間とともに増えません。</p>
    </details>` : ""}
    <div class="h-8"></div>
  </div>`;
}

function slotRow(sl){
  const p = phase(sl);
  const sel = S.detail === sl.id ? "bg-paper2/70" : "";
  const dim = (p === "done" || p === "full") ? "opacity-55" : "";
  const label = p === "tbd" ? `<span class="text-[15px]">${d(sl.date).getMonth()+1}月上旬</span>`
    : `${md(sl.date)}<span class="text-[10.5px] text-muted ml-1.5">${dow(sl.date)}</span>`;
  const ok = p !== "tbd";
  return `
  <li>
    <button data-act="${ok ? "open" : "noop"}" data-id="${esc(sl.id)}"
      class="group w-full text-left py-4 flex items-center gap-3 ${dim} ${sel} ${ok?"hover:bg-paper2/60":"cursor-default"} -mx-3 px-3 rounded-lg transition-colors">
      <span class="font-min text-[19px] tnum w-[4.8rem] shrink-0 tracking-tight">${label}</span>
      <span class="flex-1 text-[13px] text-ink2 truncate">${esc(sl.title)}</span>
      <span class="shrink-0">${slotPill(sl)}</span>
      ${ok?'<span class="hidden lg:block font-mono text-[11px] text-line2 group-hover:text-muted transition-colors">→</span>':""}
    </button>
  </li>`;
}

/* ── 活動：詳細 ────────────────────────────── */
const row = (k, v) => v ? `<div class="flex gap-4"><dt class="w-[4.5rem] shrink-0 text-muted">${k}</dt><dd class="text-ink">${v}</dd></div>` : "";

function activityDetail(){
  const sl = S.slots.find(s => s.id === S.detail);
  if (!sl) return emptyPane("左の一覧から活動を選んでください。");
  const p = phase(sl), me = joined(sl);
  const next = S.slots.filter(s => s.id !== sl.id && phase(s) === "open").sort((a,b)=>d(a.date)-d(b.date))[0];

  let action;
  if (p === "done") {
    action = `<div class="mt-8 py-3 text-center text-[12.5px] text-muted border border-line rounded-lg">終了した活動です</div>`;
  } else if (me) {
    action = `
      <button data-act="cancel" data-id="${esc(sl.id)}" class="mt-8 w-full py-3 rounded-lg border border-line2 text-[13.5px] text-ink2 hover:border-muted transition-colors">枠を取り消す</button>
      <p class="mt-3 text-center text-[11px] text-muted leading-relaxed">
        ${cancelable(sl) ? "活動日の1週間前まで、いつでも取り消せます。"
                         : "期限を過ぎています。取り消すと運営に通知が届きます。個別の連絡は不要です。"}</p>`;
  } else if (p === "full") {
    action = `
      <div class="mt-8 py-3 text-center text-[12.5px] text-muted border border-line rounded-lg">満枠です</div>
      ${next ? `<button data-act="open" data-id="${esc(next.id)}" class="mt-3 w-full py-3 rounded-lg bg-pine text-paper text-[13.5px] hover:bg-pine2 transition-colors shadow-[0_1px_2px_rgba(18,29,24,.18)]">
        次に空きがある ${md(next.date)}（${dow(next.date)}）を見る</button>` : ""}`;
  } else {
    action = `
      <button data-act="apply" data-id="${esc(sl.id)}" class="mt-8 w-full py-3.5 rounded-lg bg-pine text-paper text-[14px] tracking-[.06em] hover:bg-pine2 transition-colors shadow-[0_1px_2px_rgba(18,29,24,.18)]">枠を押さえる</button>
      <p class="mt-3 text-center text-[11px] text-muted">1週間前まで、いつでも取り消せます。</p>`;
  }

  return `
  <div class="fade">
    <div class="px-5 sm:px-7 pt-5 pb-2 lg:hidden">
      <button data-act="back" class="font-mono text-[11px] text-muted hover:text-ink transition-colors">← 一覧へ</button>
    </div>

    <div class="px-5 sm:px-7 lg:px-12 pb-10 lg:pt-10 max-w-[580px]">
      <div class="flex items-end justify-between gap-4 mt-3 lg:mt-0">
        <div>
          <p class="font-mono text-[9px] tracking-[.28em] text-soil uppercase">${dow(sl.date)}曜日</p>
          <p class="font-min text-[46px] leading-none mt-2 tnum tracking-tight">
            ${d(sl.date).getMonth()+1}<span class="text-[22px] mx-1 text-ink2">月</span>${d(sl.date).getDate()}<span class="text-[22px] ml-1 text-ink2">日</span></p>
        </div>
        <div class="shrink-0 mb-1.5">${slotPill(sl)}</div>
      </div>

      <hr class="my-7 border-line">

      <dl class="space-y-4 text-[13.5px]">
        ${row("作業", esc(sl.title))}
        ${row("集合", esc(sl.meet))}
        ${row("持ち物", esc(sl.gear))}
        ${row("定員", `<span class="tnum">${sl.cap}名</span><span class="text-muted"> / 応募 <span class="tnum">${sl.people.length}名</span></span>`)}
        ${row("あと", daysTo(sl.date) > 0 ? `<span class="tnum">${daysTo(sl.date)}日</span>` : "")}
      </dl>

}

/* ── 議題：一覧（Backlog型） ───────────────── */
function threadList(){
  const order = { todo:0, doing:1, done:2 };
  const open = S.threads.filter(t => t.state !== "done").sort((a,b)=>order[a.state]-order[b.state]);
  const done = S.threads.filter(t => t.state === "done");

  return `
  <div class="fade">
    <div class="px-5 sm:px-7 pt-8 pb-5 flex items-start justify-between gap-4">
      <div>
        <p class="font-mono text-[9px] tracking-[.28em] text-muted uppercase">Threads</p>
        <h1 class="font-min text-[25px] mt-2.5">議題</h1>
        <p class="mt-3 text-[12px] text-ink2 leading-[1.9]">議題ごとに文脈を閉じています。<br class="lg:hidden">決まったことは、常にいちばん上にあります。</p>
      </div>
      ${S.role === "operator" ? `<button data-act="newThread" class="shrink-0 px-4 py-2 rounded-lg bg-pine text-paper text-[12px] hover:bg-pine2 transition-colors shadow-[0_1px_2px_rgba(18,29,24,.18)]">＋ 追加</button>` : ""}
    </div>
    <ul class="px-5 sm:px-7 divide-y divide-line border-t border-line">
      ${open.map(threadRow).join("")}
    </ul>
    ${done.length ? `
    <details class="px-5 sm:px-7 border-t border-line">
      <summary class="py-4 text-[12px] text-muted cursor-pointer list-none flex items-center justify-between">
        <span>完了した議題 <span class="font-mono tnum">${done.length}</span></span><span class="font-mono text-[10px]">開く</span>
      </summary>
      <ul class="divide-y divide-line">${done.map(threadRow).join("")}</ul>
    </details>` : ""}
    <div class="h-8"></div>
  </div>`;
}

function threadRow(t){
  const sel = S.thread === t.id ? "bg-paper2/70" : "";
  const dim = t.state === "done" ? "opacity-55" : "";
  const last = t.comments[t.comments.length - 1];
  return `
  <li>
    <button data-act="openThread" data-id="${esc(t.id)}"
      class="w-full text-left py-4 -mx-3 px-3 rounded-lg ${sel} ${dim} hover:bg-paper2/60 transition-colors">
      <div class="flex items-center gap-3">
        <span class="font-mono text-[10px] text-soil/80 shrink-0 w-[3.8rem]">${esc(t.key)}</span>
        <span class="flex-1 text-[13.5px] truncate">${esc(t.title)}</span>
        <span class="shrink-0">${statePill(t.state)}</span>
      </div>
      <div class="mt-2 flex items-center gap-4 pl-[4.55rem] text-[11px] text-muted">
        <span class="truncate">${esc(t.owner)}</span>
        <span class="tnum shrink-0">期限 ${md(t.due)}</span>
        <span class="shrink-0 flex items-center gap-1">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a3 3 0 0 1-3 3H8l-5 4V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3z"/></svg>
          <span class="tnum">${t.comments.filter(c=>c.k==="c").length}</span>
        </span>
      </div>
      ${last ? `<p class="mt-2 pl-[4.55rem] text-[11.5px] text-muted truncate">${esc(last.body)}</p>` : ""}

  </li>`;
}

/* ── 議題：詳細＋会話 ──────────────────────── */
function threadDetail(){

  const ops = S.role === "operator";

  const stateCtl = ops ? `
    <div class="flex gap-1.5">
      ${Object.entries(ST).map(([k, v]) => `
        <button data-act="setState" data-id="${esc(t.id)}" data-s="${k}"

    </div>` : statePill(t.state);

  return `
  <div class="fade flex flex-col h-full">
    <div class="px-5 sm:px-7 lg:px-12 pt-5 lg:pt-9 pb-5 border-b border-line shrink-0">
      <button data-act="backThread" class="lg:hidden font-mono text-[11px] text-muted hover:text-ink transition-colors">← 議題一覧へ</button>
      <p class="mt-3 lg:mt-0 font-mono text-[10px] tracking-[.2em] text-soil/80">${esc(t.key)}</p>
      <h1 class="font-min text-[22px] lg:text-[26px] mt-1.5 tracking-tight">${esc(t.title)}</h1>

      <div class="mt-4 flex flex-wrap items-center gap-x-6 gap-y-3">
        ${stateCtl}
        <dl class="flex flex-wrap gap-x-6 gap-y-2 text-[11.5px]">
          <div class="flex gap-2"><dt class="text-muted">担当</dt><dd>${esc(t.owner)}</dd></div>
          <div class="flex gap-2"><dt class="text-muted">期限</dt><dd class="tnum">${md(t.due)}</dd></div>
          <div class="flex gap-2"><dt class="text-muted">更新</dt><dd class="tnum">${esc(t.updated)}</dd></div>
        </dl>
      </div>
    </div>

    <div class="flex-1 lg:overflow-y-auto px-5 sm:px-7 lg:px-12 py-7">
      <div class="max-w-[660px]">

        <!-- 決定事項：常に最上部・これだけが正 -->
        <section class="rounded-r-xl border-l-2 border-soil bg-soil/[.045] px-5 py-4.5 py-4">
          <div class="flex items-center justify-between gap-3">
            <p class="font-mono text-[9px] tracking-[.24em] text-soil uppercase">Decision · 決定事項</p>
            ${ops ? `<span class="text-[10.5px] text-muted">編集できます</span>` : ""}
          </div>
          ${ops
            ? `<textarea data-act="decEdit" data-id="${esc(t.id)}" rows="3" maxlength="300"
                 class="mt-2.5 w-full bg-transparent text-[13.5px] leading-[2] text-ink outline-none resize-none border-b border-dashed border-soil/30 focus:border-soil transition-colors">${esc(t.decision)}</textarea>`
            : `<p class="mt-2.5 text-[13.5px] leading-[2] text-ink pre">${esc(t.decision)}</p>`}
          <p class="mt-3 text-[10.5px] text-muted leading-relaxed">下の会話が全部流れても、ここだけで用が足りるようにしています。</p>

        <!-- 会話 -->

          <span class="font-mono text-[9px] tracking-[.24em] text-muted uppercase">Comments</span>

          ${t.comments.map(commentItem).join("")}

          <div class="flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-full bg-pine/10 border border-pine/25 grid place-items-center font-min text-[12px] text-pine">${esc(who().slice(0,1))}</span>
            <span class="text-[12px] text-muted">${esc(who())} として書き込む</span>
          </div>
          <textarea name="body" rows="3" maxlength="600" placeholder="この議題について書く"
            class="mt-3.5 w-full px-3.5 py-2.5 rounded-lg border border-line2 bg-paper/70 text-[13px] leading-[1.9] outline-none focus:border-pine transition-colors resize-y"></textarea>
          <div class="mt-3.5 flex items-center justify-between gap-3">
            <p class="text-[10.5px] text-muted">全体への周知はMessengerのままです。</p>
            <button class="px-5 py-2 rounded-lg bg-pine text-paper text-[12.5px] hover:bg-pine2 transition-colors shadow-[0_1px_2px_rgba(18,29,24,.18)]">書き込む</button>
          </div>
        </form>
        <div class="h-6"></div>
      </div>

/* ── 運営者ビュー ──────────────────────────── */
const stat = (k, v) => `
  <div class="rounded-xl border border-line bg-card p-5 shadow-[0_1px_2px_rgba(25,28,26,.04)]">
    <dt class="font-mono text-[9px] tracking-[.2em] text-muted uppercase">${k}</dt>
    <dd class="font-min text-[26px] tnum mt-2 text-pine tracking-tight">${v}</dd></div>`;

function viewOpsActivity(){
  const live = S.slots.filter(s => s.state !== "done").sort((a, b) => d(a.date) - d(b.date));
  const pub  = live.filter(s => s.state === "open");
  const capSum = pub.reduce((a, s) => a + s.cap, 0);
  const rate = capSum ? Math.round(pub.reduce((a, s) => a + s.people.length, 0) / capSum * 100) : 0;

  return `
  <div class="fade px-5 sm:px-7 lg:px-12 pt-8 lg:pt-10 pb-10 max-w-[1000px]">
    <p class="font-mono text-[9px] tracking-[.28em] text-muted uppercase">Operator</p>
    <h1 class="font-min text-[25px] mt-2.5">応募状況</h1>

    <dl class="mt-7 grid grid-cols-3 gap-3 max-w-[520px]">
      ${stat("充足率", rate + "%")}${stat("公開中", pub.length + "件")}${stat("調整中", live.filter(s=>s.state==="tbd").length + "件")}
    </dl>

    <div class="mt-7 grid md:grid-cols-2 gap-4">
      ${live.map(sl => {
        const p = phase(sl), pct = Math.min(100, Math.round(sl.people.length / sl.cap * 100));
        return `
        <article class="rounded-xl border border-line bg-card p-6 shadow-[0_1px_2px_rgba(25,28,26,.04)]">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="font-min text-[19px] tnum tracking-tight">${p === "tbd" ? `${d(sl.date).getMonth() + 1}月上旬`
                : `${md(sl.date)}<span class="text-[11px] text-muted ml-1.5">${dow(sl.date)}</span>`}</p>
              <p class="text-[12.5px] text-ink2 mt-1">${esc(sl.title)}</p>
            </div>${slotPill(sl)}
          </div>

          ${p === "tbd" ? `
            <p class="mt-4 text-[11.5px] text-muted leading-relaxed">日程が未定でも、空白にせず「調整中」として出しています。</p>
            <button data-act="fix" data-id="${esc(sl.id)}" class="mt-3.5 w-full py-2.5 rounded-lg border border-line2 text-[12.5px] hover:border-muted transition-colors">日程を確定する</button>
          ` : `
            <div class="mt-4">
              <div class="flex items-center justify-between text-[11px] text-muted">
                <span>応募 <span class="tnum text-ink">${sl.people.length}</span> / 定員 <span class="tnum">${sl.cap}</span></span>
                <span class="font-mono tnum">${pct}%</span>
              </div>
              <div class="mt-2 h-1 rounded-full bg-line overflow-hidden"><div class="h-full bg-pine transition-all duration-500" style="width:${pct}%"></div></div>
              <ul class="mt-4 space-y-2">
                ${sl.people.map(n => { const m = S.members.find(x => x.name === n);
                  return `<li class="flex items-center justify-between gap-3 text-[12px]"><span>${esc(n)}</span>
                    <span class="text-muted font-mono text-[10.5px] shrink-0">${m ? `${m.count}回目 · ${esc(m.skills.slice(0,2).join("/") || "—")}` : "初参加"}</span></li>`;
                }).join("") || `<li class="text-[12px] text-muted">まだ応募がありません</li>`}
              </ul>
            </div>`}
          <p class="mt-4 pt-3 border-t border-line font-mono text-[10px] text-muted">更新 ${esc(sl.updated)}</p>
        </article>`;
      }).join("")}
    </div>

    <form data-act="slotAdd" class="mt-6 p-6 rounded-xl border border-dashed border-line2 max-w-[520px]">
      <p class="text-[13px]">活動日を追加</p>
      <p class="mt-1.5 text-[11px] text-muted leading-relaxed">2週間前までに立てるのが運用ルールです。立てられない場合も「調整中」として出します。</p>
      <div class="mt-3.5 grid sm:grid-cols-[1fr_auto] gap-2">
        <input type="date" name="date" value="2026-10-10" class="px-3.5 py-2 rounded-lg border border-line2 bg-paper/70 text-[12.5px] outline-none focus:border-pine transition-colors">
        <input name="cap" type="number" min="1" max="30" value="5" class="w-full sm:w-20 px-3.5 py-2 rounded-lg border border-line2 bg-paper/70 text-[12.5px] outline-none focus:border-pine transition-colors">
      </div>
      <input name="title" placeholder="作業内容（1行）" maxlength="60"
        class="mt-2 w-full px-3.5 py-2 rounded-lg border border-line2 bg-paper/70 text-[12.5px] outline-none focus:border-pine transition-colors">
      <button class="mt-3.5 w-full py-2.5 rounded-lg bg-pine text-paper text-[12.5px] hover:bg-pine2 transition-colors shadow-[0_1px_2px_rgba(18,29,24,.18)]">追加する</button>
    </form>
  </div>`;
}

          <div><p class="text-[13.5px]">${esc(m.name)}</p><p class="text-[11px] text-muted mt-1">${esc(m.skills.join(" / ") || "—")}</p></div>
          <div class="text-right shrink-0">
            <p class="font-min text-[19px] tnum tracking-tight">${m.count}<span class="text-[11px] text-muted ml-0.5">回</span></p>
            <p class="font-mono text-[10px] text-muted mt-0.5 tnum">${esc(m.last.replace(/-/g, "."))}</p></div>
        </li>`).join("")}
    </ul>
  </div>`;
}

const emptyPane = msg => `
  <div class="hidden lg:flex h-full items-center justify-center px-10">
    <div class="text-center">
      <p class="font-min text-[34px] text-line2 select-none">山</p>
      <p class="mt-4 text-[12.5px] text-muted leading-relaxed">${esc(msg)}</p>
    </div>
  </div>`;

/* 一覧＋詳細の二枚組（PCは左右、スマホは切り替え） */
function split(listMarkup, detailMarkup, hasSelection){
  if (!DESK()) return hasSelection ? detailMarkup : listMarkup;
  return `
    <div class="flex h-full">
      <div class="w-[390px] xl:w-[430px] shrink-0 border-r border-line overflow-y-auto">${listMarkup}</div>
      <div class="flex-1 min-w-0 overflow-y-auto bg-card/40">${detailMarkup}</div>
    </div>`;
}

/* ── ナビ ──────────────────────────────────── */
const ICON = {
  activity:'<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>',
  profile: '<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c0-3.6 3.4-5.6 7.5-5.6s7.5 2 7.5 5.6"/>',
  faq:     '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3 2.4V14"/><path d="M12 17.3v.2"/>',
  threads: '<path d="M21 14.5a3 3 0 0 1-3 3H8.5L4 21V6.5a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3z"/>'
};
const TABS = {
  volunteer: [["activity", "活動"], ["profile", "記録"],     ["faq", "FAQ"], ["threads", "議題"]],
  operator:  [["activity", "応募"], ["profile", "メンバー"], ["faq", "FAQ"], ["threads", "議題"]]
};
const CRUMB = { activity:{volunteer:"次の活動",operator:"応募状況"}, profile:{volunteer:"あなたの記録",operator:"メンバー"},
                faq:{volunteer:"よくある質問",operator:"よくある質問"}, threads:{volunteer:"議題",operator:"議題"} };

/* ── 描画 ──────────────────────────────────── */
function render(){
  const ops = S.role === "operator";
  document.getElementById("roleLabel").textContent = ops ? "運営" : "参加者";
  document.getElementById("roleChip").textContent  = ops ? "Operator" : "";
  document.getElementById("crumb").textContent     = CRUMB[S.tab][S.role];

  let markup;
  if (S.tab === "activity")      markup = ops ? viewOpsActivity() : split(activityList(), activityDetail(), !!S.detail);
  else if (S.tab === "profile")  markup = ops ? viewOpsMembers()  : viewProfile();
  else if (S.tab === "faq")      markup = viewFaq();
  else                           markup = split(threadList(), threadDetail(), !!S.thread);

  const view = document.getElementById("view");
  mount(view, markup);
  view.scrollTop = 0;

  mount(document.getElementById("tabs"), TABS[S.role].map(([k, label]) => `
    <button data-act="go" data-tab="${k}" class="py-3 text-[11px] transition-colors ${S.tab===k?"text-paper":"text-sage/60"}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto ${S.tab===k?"text-ember":""}">${ICON[k]}</svg>
      <span class="block mt-1">${label}</span>
    </button>`).join(""));

  mount(document.getElementById("side"), TABS[S.role].map(([k, label]) => `
    <button data-act="go" data-tab="${k}"
      class="w-full flex items-center gap-3.5 px-4 py-2.5 rounded-lg text-[13px] transition-colors border ${S.tab===k?"bg-paper/10 text-paper border-paper/10":"text-sage/75 border-transparent hover:text-paper hover:bg-paper/5"}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${S.tab===k?"text-ember":""}">${ICON[k]}</svg>
      ${label}
    </button>`).join(""));

  save();
}

/* ── イベント ──────────────────────────────── */
document.addEventListener("click", e => {
  const el = e.target.closest("button[data-act]");
  if (!el) return;
  const a = el.dataset.act;

  if (a === "go")          { S.tab = el.dataset.tab; S.detail = null; S.thread = null; render(); }
  if (a === "open")        { S.detail = el.dataset.id; S.tab = "activity"; render(); }
  if (a === "back")        { S.detail = null; render(); }
  if (a === "openThread")  { S.thread = el.dataset.id; render(); }
  if (a === "backThread")  { S.thread = null; render(); }
  if (a === "filter")      { filter = el.dataset.k; render(); }

  if (a === "apply") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl && left(sl) > 0 && !joined(sl)) { sl.people.push("あなた"); toast("枠を押さえました"); render(); }
  }
  if (a === "cancel") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl) { const late = !cancelable(sl); sl.people = sl.people.filter(p => p !== "あなた");
              toast(late ? "取り消しました。運営に通知しました" : "取り消しました"); render(); }
  }
  if (a === "fix") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl) { sl.state="open"; sl.meet="折立 6:30"; sl.gear="作業手袋"; sl.updated="8/11"; toast("日程を確定しました"); render(); }
  }
  if (a === "setState") {
    const t = S.threads.find(x => x.id === el.dataset.id), next = el.dataset.s;
    if (t && t.state !== next) {
      t.comments.push({ k:"e", who:who(), at:stamp(), body:`状態を ${ST[t.state].label} → ${ST[next].label} に変更しました` });
      t.state = next; t.updated = stamp(); toast(`状態を「${ST[next].label}」にしました`); render();
    }
  }
  if (a === "newThread") {
    const t = { id:"t"+Date.now(), key:"KUMO-"+(S.threads.length+1), title:"新しい議題", owner:"未定",
                due:"2026-12-31", state:"todo", updated:stamp(), decision:"（まだ決まっていません）", comments:[] };
    S.threads.unshift(t); S.thread = t.id; toast("議題を追加しました"); render();
  }
  if (a === "skillDel") { S.me.skills.splice(Number(el.dataset.i), 1); render(); }
  if (a === "role")     { S.role = S.role === "operator" ? "volunteer" : "operator"; S.detail = null; render(); }
  if (a === "reset")    { localStorage.removeItem(KEY); S = structuredClone(SEED); filter="all"; faqQuery=""; toast("初期状態に戻しました"); render(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-act]");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), a = f.dataset.act;

  if (a === "comment") {
    const t = S.threads.find(x => x.id === f.dataset.id);
    const body = clean(fd.get("body"), 600);
    if (t && body) {
      t.comments.push({ k:"c", who:who(), at:stamp(), body });
      t.updated = stamp(); toast("書き込みました"); render();
    }
  }
  if (a === "skillAdd") {
    const v = clean(fd.get("skill"), 40);
    if (v && !S.me.skills.includes(v)) { S.me.skills.push(v); render(); }
  }
  if (a === "ask") { if (clean(fd.get("q"), 100)) { toast("送りました。誰が聞いたかは残りません"); f.reset(); } }
  if (a === "slotAdd") {
    const date = clean(fd.get("date"), 10), title = clean(fd.get("title"), 60);
    const cap = Math.min(30, Math.max(1, Number(fd.get("cap")) || 5));
    if (/^\d{4}-\d{2}-\d{2}$/.test(date) && title) {
      S.slots.push({ id:"s"+Date.now(), date, title, meet:"折立 6:30", gear:"作業手袋", note:"", cap, people:[], state:"open", updated:"8/11" });
      toast("活動日を追加しました"); render();
    }
  }
  if (a === "threadAdd") {
    const title = clean(fd.get("title"), 60);
    const decision = clean(fd.get("decision"), 200);
    if (title) {
      S.threads.unshift({ id:"t"+Date.now(), key:"KUMO-"+(S.threads.length+1), title, owner:"山本 明彦", due:"2026-12-31", state:"todo",
                          updated:stamp(), decision: decision || "（まだ決まっていません）", comments:[] });
      toast("議題を追加しました"); render();
    }
  }
});

document.addEventListener("input", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "faqSearch") {
    faqQuery = clean(el.value, 40);
    const pos = el.selectionStart; render();
    const next = document.querySelector('[data-act="faqSearch"]');
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  }
  if (el.dataset.act === "decEdit") {
    const t = S.threads.find(x => x.id === el.dataset.id);
    if (t) { t.decision = clean(el.value, 300); save(); }
  }
});

window.matchMedia("(min-width:1024px)").addEventListener("change", render);
render();
</script>
