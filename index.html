/* ══ 稜線と空（Canvas） ═══════════════════════
   雲ノ平は溶岩台地。遠景をやわらかく、近景を鋭く重ねる。 */
function fbm(x, seed){
  let v = 0, a = .5, f = 1;
  for (let i = 0; i < 4; i++){
    v += a * Math.sin(x * f + seed * (i + 1) * 1.73) * Math.cos(x * f * .58 + seed * (i + 2) * .91);
    a *= .52; f *= 2.07;
  }
  return v;
}
function ridge(g, w, h, { foot, amp, seed, fill }){
  g.beginPath();
  g.moveTo(0, h);
  for (let x = 0; x <= w; x += 2){
    const t = x / Math.max(w, 1);
    g.lineTo(x, foot - amp * (fbm(t * 3.1 + .4, seed) * .5 + .5));
  }
  g.lineTo(w, h);
  g.closePath();
  g.fillStyle = fill;
  g.fill();
}
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function drawSky(g, w, h){
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0,   "#060C0A");
  sky.addColorStop(.34, "#0C1B17");
  sky.addColorStop(.62, "#16332C");
  sky.addColorStop(.84, "#2C4C3F");
  sky.addColorStop(1,   "#4E5A44");
  g.fillStyle = sky; g.fillRect(0, 0, w, h);

  // 星（座標は固定。ちらつかせない）
  for (let i = 0; i < 60; i++){
    const x = rnd(i) * w, y = rnd(i + 91) * h * .62, s = .9 + rnd(i + 37) * .8;
    g.globalAlpha = .12 + rnd(i + 173) * .5;
    g.fillStyle = "#F7F8F6";
    g.fillRect(x, y, s, s);
  }
  g.globalAlpha = 1;

  // 稜線の向こうの残照
  const glow = g.createRadialGradient(w * .72, h * .78, 0, w * .72, h * .78, w * .55);
  glow.addColorStop(0, "rgba(214,164,104,.30)");
  glow.addColorStop(1, "rgba(214,164,104,0)");
  g.fillStyle = glow; g.fillRect(0, 0, w, h);

  ridge(g, w, h, { foot: h * .66, amp: h * .22, seed: 1.7, fill: "#20423A" });
  ridge(g, w, h, { foot: h * .80, amp: h * .19, seed: 4.1, fill: "#132A24" });
  ridge(g, w, h, { foot: h * .93, amp: h * .16, seed: 8.6, fill: "#08120F" });
}
function drawSide(g, w, h){

  ridge(g, w, h, { foot: h * .90, amp: h * .28, seed: 6.9, fill: "rgba(143,167,154,.13)" });
}
/* シートの末尾。余白を「地平線」で閉じる */
function drawHorizon(g, w, h){

  ridge(g, w, h, { foot: h * .80, amp: h * .30, seed: 5.8, fill: "#DCE3DF" });

}

function paintCanvases(root = document){
  root.querySelectorAll("canvas[data-canvas]").forEach(cv => {
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width  = Math.round(r.width  * dpr);
    cv.height = Math.round(r.height * dpr);
    const g = cv.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    (PAINT[cv.dataset.canvas] || (()=>{}))(g, r.width, r.height);
  });
}

        <p class="text-[14px] text-ink2">この条件の予定はありません。</p>
        <button data-act="filter" data-k="all" class="mt-3 text-[13px] text-moss font-medium underline underline-offset-4">すべての予定を見る</button>
      </div>`}

    ${past.length ? `
      <details class="mt-8 border-t border-line">
        <summary class="tap flex items-center justify-between py-4 text-[13px] text-muted cursor-pointer list-none">
          <span>過去の記録 <span class="tnum">${past.length}</span></span><span class="text-[12px]">開く</span>
        </summary>
        <ul class="divide-y divide-line">${past.map(slotRow).join("")}</ul>
        <p class="py-4 text-[11.5px] text-muted leading-relaxed">終わった活動は畳んでいます。画面の情報量は、時間とともに増えません。</p>
      </details>` : ""}
  `;
  return sheet(inner);
}

/* 「次の1件」だけは大きく。5秒で決められるように */
function heroCard(sl){
  const p = phase(sl), me = joined(sl);
  const tbd = p === "tbd";
  const cta = tbd
    ? `<div class="mt-5 py-3 text-center text-[13px] text-muted border border-dashed border-line2 rounded-xl">日程が決まったら、ここに出ます</div>`
    : `<button data-act="open" data-id="${esc(sl.id)}"
         class="mt-5 w-full py-3.5 rounded-xl bg-moss text-snow text-[14.5px] font-medium hover:bg-moss2 transition-colors shadow-[0_2px_10px_rgba(47,107,87,.25)]">
         ${me ? "詳細を見る" : p === "full" ? "詳細を見る" : "詳細を見て、枠を押さえる"}</button>`;

  return `
  <article class="relative rounded-2xl bg-white border border-line p-5 sm:p-6 shadow-[0_1px_2px_rgba(19,26,23,.04),0_12px_28px_-18px_rgba(19,26,23,.35)]">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-[12px] text-muted">${tbd ? "次の予定" : daysTo(sl.date) > 0 ? `あと <span class="tnum text-ink2 font-medium">${daysTo(sl.date)}</span> 日` : "本日"}</p>
        <p class="mt-1.5 font-min leading-none tracking-tight">
          ${tbd
            ? `<span class="text-[34px]">${d(sl.date).getMonth()+1}月上旬</span>`
            : `<span class="text-[52px] tnum">${d(sl.date).getDate()}</span>
               <span class="ml-1.5 text-[17px] text-ink2">${d(sl.date).getMonth()+1}月・${dow(sl.date)}</span>`}
        </p>
      </div>
      <div class="shrink-0 mt-1">${slotPill(sl)}</div>
    </div>

    <p class="mt-5 text-[16px] font-medium leading-snug">${esc(sl.title)}</p>

    ${tbd ? "" : `
      <dl class="mt-3.5 flex flex-wrap gap-x-5 gap-y-1.5 text-[12.5px] text-ink2">
        <div class="flex gap-1.5"><dt class="text-muted">集合</dt><dd>${esc(sl.meet)}</dd></div>
        <div class="flex gap-1.5"><dt class="text-muted">定員</dt><dd class="tnum">${sl.people.length} / ${sl.cap}名</dd></div>
      </dl>`}

    ${cta}
  </article>`;
}

function slotRow(sl){
  const p = phase(sl);
  const sel = S.detail === sl.id ? "bg-mist/70" : "";
  const dim = (p === "done" || p === "full") ? "opacity-55" : "";
  const ok = p !== "tbd";
  return `
  <li>
    <button data-act="${ok ? "open" : "noop"}" data-id="${esc(sl.id)}"
      class="tap w-full text-left py-3.5 flex items-center gap-4 ${dim} ${sel} ${ok?"hover:bg-mist/60":"cursor-default"} -mx-2 px-2 rounded-xl transition-colors">
      <span class="shrink-0 w-[52px] text-center">
        ${p === "tbd"
          ? `<span class="font-min text-[15px] leading-none">${d(sl.date).getMonth()+1}月<br><span class="text-[12px] text-muted">上旬</span></span>`
          : `<span class="font-min text-[24px] leading-none tnum block">${d(sl.date).getDate()}</span>
             <span class="text-[11px] text-muted block mt-1">${d(sl.date).getMonth()+1}月 ${dow(sl.date)}</span>`}
      </span>
      <span class="flex-1 min-w-0">
        <span class="block text-[14px] truncate">${esc(sl.title)}</span>
        ${sl.meet ? `<span class="block text-[11.5px] text-muted mt-0.5">${esc(sl.meet)}</span>` : ""}
      </span>
      <span class="shrink-0">${slotPill(sl)}</span>
    </button>
  </li>`;
}

/* ══ 活動：詳細 ═══════════════════════════════ */
const row = (k, v) => v ? `
  <div class="flex gap-4 py-3 border-b border-line last:border-0">
    <dt class="w-[4.5rem] shrink-0 text-muted text-[12.5px] pt-px">${k}</dt>
    <dd class="text-[14px] text-ink leading-relaxed">${v}</dd>
  </div>` : "";

function activityDetail(){
  const sl = S.slots.find(s => s.id === S.detail);
  if (!sl) return emptyPane("左の一覧から活動を選んでください。");
  const p = phase(sl), me = joined(sl);
  const next = S.slots.filter(s => s.id !== sl.id && phase(s) === "open").sort((a,b)=>d(a.date)-d(b.date))[0];

  let action;
  if (p === "done") {
    action = `<div class="mt-7 py-3.5 text-center text-[13px] text-muted border border-line rounded-xl">終了した活動です</div>`;
  } else if (me) {
    action = `
      <button data-act="cancel" data-id="${esc(sl.id)}" class="mt-7 w-full py-3.5 rounded-xl border border-line2 text-[14px] text-ink2 hover:border-muted transition-colors">枠を取り消す</button>
      <p class="mt-3 text-center text-[12px] text-muted leading-relaxed">
        ${cancelable(sl) ? "活動日の1週間前まで、いつでも取り消せます。"
                         : "期限を過ぎています。取り消すと運営に通知が届きます。個別の連絡は不要です。"}</p>`;
  } else if (p === "full") {
    action = `
      <div class="mt-7 py-3.5 text-center text-[13px] text-muted border border-line rounded-xl">満枠です</div>
      ${next ? `<button data-act="open" data-id="${esc(next.id)}" class="mt-3 w-full py-3.5 rounded-xl bg-moss text-snow text-[14px] font-medium hover:bg-moss2 transition-colors">
        次に空きがある ${md(next.date)}（${dow(next.date)}）を見る</button>` : ""}`;
  } else {
    action = `
      <button data-act="apply" data-id="${esc(sl.id)}"
        class="mt-7 w-full py-4 rounded-xl bg-moss text-snow text-[15px] font-medium hover:bg-moss2 transition-colors shadow-[0_2px_12px_rgba(47,107,87,.28)]">枠を押さえる</button>
      <p class="mt-3 text-center text-[12px] text-muted">1週間前まで、いつでも取り消せます。</p>`;
  }

  const inner = `
    <button data-act="back" class="lg:hidden -mt-1 mb-4 inline-flex items-center gap-1.5 text-[13px] text-muted hover:text-ink transition-colors">
      <span aria-hidden="true">←</span>一覧へ</button>

    <div class="max-w-[600px] rise rise-1">
      <div class="flex items-end justify-between gap-4">
        <div>
          <p class="text-[12.5px] text-muted">${daysTo(sl.date) > 0 ? `あと <span class="tnum text-ink2 font-medium">${daysTo(sl.date)}</span> 日` : "本日"}</p>
          <p class="mt-1.5 font-min leading-none tracking-tight">
            <span class="text-[64px] tnum">${d(sl.date).getDate()}</span>
            <span class="ml-2 text-[19px] text-ink2">${d(sl.date).getMonth()+1}月・${dow(sl.date)}曜</span>
          </p>
        </div>
        <div class="shrink-0 mb-2">${slotPill(sl)}</div>
      </div>

      <h2 class="mt-6 text-[19px] font-bold tracking-tight leading-snug">${esc(sl.title)}</h2>

      <dl class="mt-5 border-t border-line">
        ${row("集合", esc(sl.meet))}
        ${row("持ち物", esc(sl.gear))}
        ${row("定員", `<span class="tnum">${sl.cap}名</span><span class="text-muted"> / 応募 <span class="tnum">${sl.people.length}名</span></span>`)}
      </dl>

      ${sl.note ? `<p class="mt-6 p-4 rounded-xl bg-mist/70 text-[13px] leading-[1.9] text-ink2">${esc(sl.note)}</p>` : ""}

      ${action}

      <p class="mt-9 pt-5 border-t border-line text-[11.5px] text-muted leading-relaxed">
        更新 <span class="tnum">${esc(sl.updated)}</span>・誰が応募しているかは表示していません。参加歴で気後れしないためです。
      </p>
    </div>`;
  return sheet(inner);
}

/* ══ 記録 ═════════════════════════════════════ */

          <ul class="mt-2 divide-y divide-line">${upcoming.map(s=>`

      <div class="mt-4 flex flex-wrap gap-2">
        ${S.me.skills.map((s,i)=>`
          <span class="inline-flex items-center gap-2 pl-3.5 pr-2 py-2 rounded-full bg-mist text-[13px]">
            ${esc(s)}<button data-act="skillDel" data-i="${i}" aria-label="${esc(s)}を削除"

      <form data-act="skillAdd" class="mt-4 flex gap-2 max-w-[420px]">

        <button class="px-5 py-2.5 rounded-xl bg-moss text-snow text-[13.5px] font-medium hover:bg-moss2 transition-colors">追加</button>
      </form>
    </div>

    <p class="mt-6 max-w-[760px] text-[11.5px] text-muted leading-relaxed">累計の参加回数は、他の参加者には表示していません。参加歴で序列を作らないためです。</p>`;
  return sheet(inner);
}

/* ══ FAQ ══════════════════════════════════════ */

  const inner = `
    <div class="max-w-[720px] rise rise-1">
      <input data-act="faqSearch" value="${esc(faqQuery)}" placeholder="キーワードで探す" maxlength="40"
        class="w-full sm:max-w-[420px] px-4 py-3 rounded-xl border border-line2 bg-white text-[14px] outline-none focus:border-moss transition-colors">

      <div class="mt-5 rounded-2xl bg-white border border-line overflow-hidden divide-y divide-line">
        ${list.length ? list.map(f=>`
          <details class="group">
            <summary class="tap flex items-start justify-between gap-4 px-5 py-4 cursor-pointer list-none hover:bg-mist/50 transition-colors">
              <span class="text-[14px] leading-snug group-open:font-medium transition-all">${esc(f.q)}</span>
              <span class="shrink-0 mt-1 text-muted transition-transform group-open:rotate-45" aria-hidden="true">＋</span>
            </summary>
            <div class="px-5 pb-5 -mt-1">
              <p class="text-[13.5px] leading-[2] text-ink2">${esc(f.a)}</p>

            </div>

      <div class="mt-5 p-5 sm:p-6 rounded-2xl border border-dashed border-line2 rise rise-2">

        <form data-act="ask" class="mt-4 flex gap-2">
          <input name="q" placeholder="質問を書く" maxlength="100"

/* ══ 議題：一覧 ═══════════════════════════════ */
function threadList(){
  const order = { todo:0, doing:1, done:2 };
  const open = S.threads.filter(t => t.state !== "done").sort((a,b)=>order[a.state]-order[b.state]);
  const done = S.threads.filter(t => t.state === "done");

  const inner = `
    ${S.role === "operator" ? `
      <button data-act="newThread" class="mb-4 w-full sm:w-auto px-5 py-2.5 rounded-xl bg-moss text-snow text-[13.5px] font-medium hover:bg-moss2 transition-colors">＋ 議題を追加</button>` : ""}

    <ul class="space-y-2.5 rise rise-1">${open.map(threadRow).join("")}</ul>

    ${done.length ? `
      <details class="mt-6 border-t border-line">
        <summary class="tap flex items-center justify-between py-4 text-[13px] text-muted cursor-pointer list-none">
          <span>完了した議題 <span class="tnum">${done.length}</span></span><span class="text-[12px]">開く</span>
        </summary>
        <ul class="space-y-2.5 pb-2">${done.map(threadRow).join("")}</ul>
      </details>` : ""}`;
  return sheet(inner);
}

function threadRow(t){
  const sel  = S.thread === t.id ? "border-moss/40 bg-moss/[.04]" : "border-line bg-white";
  const dim  = t.state === "done" ? "opacity-60" : "";
  const last = t.comments[t.comments.length - 1];
  const n    = t.comments.filter(c=>c.k==="c").length;
  return `
  <li>
    <button data-act="openThread" data-id="${esc(t.id)}"
      class="w-full text-left rounded-2xl border ${sel} ${dim} p-4 sm:p-5 hover:border-line2 transition-colors">
      <div class="flex items-start justify-between gap-3">
        <p class="text-[15px] font-medium leading-snug">${esc(t.title)}</p>
        <span class="shrink-0">${statePill(t.state)}</span>
      </div>
      <div class="mt-2.5 flex flex-wrap items-center gap-x-4 gap-y-1 text-[11.5px] text-muted">
        <span class="tnum">${esc(t.key)}</span>
        <span>${esc(t.owner)}</span>
        <span>期限 <span class="tnum">${md(t.due)}</span></span>
        <span class="inline-flex items-center gap-1">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a3 3 0 0 1-3 3H8l-5 4V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3z"/></svg>
          <span class="tnum">${n}</span></span>
      </div>
      ${last ? `<p class="mt-2.5 text-[12.5px] text-ink2/75 leading-snug line-clamp-2 truncate">${esc(last.body)}</p>` : ""}
    </button>
  </li>`;
}

/* ══ 議題：詳細＋会話 ═════════════════════════ */
function threadDetail(){
  const t = S.threads.find(x => x.id === S.thread);
  if (!t) return emptyPane("左の一覧から議題を選んでください。");
  const ops = S.role === "operator";

  const stateCtl = ops ? `
    <div class="flex gap-1.5 flex-wrap">
      ${Object.entries(ST).map(([k, v]) => `
        <button data-act="setState" data-id="${esc(t.id)}" data-s="${k}"
          class="px-3.5 py-1.5 rounded-full border text-[12px] transition-colors ${
            t.state===k ? "border-moss bg-moss/10 text-moss font-medium" : "border-line2 text-muted hover:border-muted"}">${v.label}</button>`).join("")}
    </div>` : statePill(t.state);

  return `
  <div class="flex flex-col h-full">
    <div class="px-5 sm:px-7 lg:px-10 pt-6 pb-5 border-b border-line shrink-0 bg-snow">
      <button data-act="backThread" class="lg:hidden -mt-1 mb-3 inline-flex items-center gap-1.5 text-[13px] text-muted hover:text-ink transition-colors">
        <span aria-hidden="true">←</span>議題一覧へ</button>
      <p class="text-[11.5px] text-muted tnum">${esc(t.key)}</p>
      <h2 class="mt-1 text-[21px] lg:text-[24px] font-bold tracking-tight leading-snug">${esc(t.title)}</h2>
      <div class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-3">
        ${stateCtl}
        <dl class="flex flex-wrap gap-x-5 gap-y-1.5 text-[12px] text-ink2">
          <div class="flex gap-2"><dt class="text-muted">担当</dt><dd>${esc(t.owner)}</dd></div>
          <div class="flex gap-2"><dt class="text-muted">期限</dt><dd class="tnum">${md(t.due)}</dd></div>
          <div class="flex gap-2"><dt class="text-muted">更新</dt><dd class="tnum">${esc(t.updated)}</dd></div>
        </dl>
      </div>
    </div>

    <div class="flex-1 lg:overflow-y-auto px-5 sm:px-7 lg:px-10 py-6">
      <div class="max-w-[680px]">

        <!-- 決定事項：常に最上部・これだけが正 -->
        <section class="rounded-2xl bg-white border border-line p-5 shadow-[0_1px_2px_rgba(19,26,23,.04)]">
          <div class="flex items-center justify-between gap-3">
            <p class="text-[12.5px] font-bold tracking-wide text-moss">決定事項</p>
            ${ops ? `<span class="text-[11px] text-muted">編集できます</span>` : ""}
          </div>
          ${ops
            ? `<textarea data-act="decEdit" data-id="${esc(t.id)}" rows="3" maxlength="300"
                 class="mt-2.5 w-full bg-transparent text-[14.5px] leading-[1.95] text-ink outline-none resize-none border-b border-dashed border-line2 focus:border-moss transition-colors">${esc(t.decision)}</textarea>`
            : `<p class="mt-2.5 text-[14.5px] leading-[1.95] text-ink pre">${esc(t.decision)}</p>`}
          <p class="mt-3 text-[11px] text-muted leading-relaxed">下の会話が全部流れても、ここだけで用が足りるようにしています。</p>
        </section>

        <div class="mt-8 flex items-center gap-3">
          <span class="text-[12.5px] font-medium text-ink2">会話</span>
          <span class="text-[11.5px] text-muted tnum">${t.comments.filter(c=>c.k==="c").length}</span>
          <span class="h-px flex-1 bg-line"></span>
        </div>

        <ol class="mt-5 space-y-3.5">${t.comments.map(commentItem).join("")}</ol>

        <form data-act="comment" data-id="${esc(t.id)}" class="mt-7 rounded-2xl bg-white border border-line p-4 sm:p-5">
          <div class="flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-full bg-moss/10 border border-moss/25 grid place-items-center font-min text-[12.5px] text-moss">${esc(who().slice(0,1))}</span>
            <span class="text-[12.5px] text-muted">${esc(who())} として書き込む</span>
          </div>
          <textarea name="body" rows="3" maxlength="600" placeholder="この議題について書く"
            class="mt-3 w-full px-4 py-3 rounded-xl border border-line2 bg-snow text-[14px] leading-[1.9] outline-none focus:border-moss transition-colors resize-y"></textarea>
          <div class="mt-3 flex items-center justify-between gap-3">
            <p class="text-[11px] text-muted">全体への周知はMessengerのままです。</p>
            <button class="px-5 py-2.5 rounded-xl bg-moss text-snow text-[13.5px] font-medium hover:bg-moss2 transition-colors">書き込む</button>
          </div>
        </form>
        <div class="h-8"></div>
      </div>
    </div>
  </div>`;
}

function commentItem(c){
  if (c.k === "e") return `
    <li class="flex items-center gap-3 text-[11.5px] text-muted">
      <span class="h-px flex-1 bg-line"></span>
      <span class="shrink-0">${esc(c.body)} <span class="tnum">${esc(c.at)}</span></span>
      <span class="h-px flex-1 bg-line"></span>
    </li>`;
  const mine = c.who === who();
  return `
    <li class="flex gap-3 ${mine ? "flex-row-reverse" : ""}">
      <span class="shrink-0 w-8 h-8 rounded-full ${mine?"bg-moss/10 border-moss/25 text-moss":"bg-mist border-line text-ink2"} border grid place-items-center font-min text-[13px]">${esc(c.who.slice(0,1))}</span>
      <div class="flex-1 min-w-0 rounded-2xl border border-line ${mine?"bg-moss/[.05]":"bg-white"} px-4 py-3.5">
        <div class="flex items-baseline justify-between gap-3">
          <span class="text-[13px] font-medium">${esc(c.who)}</span>
          <span class="text-[11px] text-muted tnum shrink-0">${esc(c.at)}</span>
        </div>
        <p class="mt-1.5 text-[14px] leading-[1.95] text-ink2 pre">${esc(c.body)}</p>
      </div>
    </li>`;
}

/* ══ 運営ビュー ═══════════════════════════════ */
const stat = (k, v, sub) => `
  <div class="rounded-2xl bg-white border border-line p-4 sm:p-5">
    <dt class="text-[11.5px] text-muted">${k}</dt>
    <dd class="mt-1.5 font-min text-[30px] tnum text-moss leading-none tracking-tight">${v}<span class="ml-0.5 text-[13px] text-ink2">${sub}</span></dd>
  </div>`;

function viewOpsActivity(){
  const live = S.slots.filter(s => s.state !== "done").sort((a, b) => d(a.date) - d(b.date));
  const pub  = live.filter(s => s.state === "open");
  const capSum = pub.reduce((a, s) => a + s.cap, 0);
  const rate = capSum ? Math.round(pub.reduce((a, s) => a + s.people.length, 0) / capSum * 100) : 0;

  const inner = `
    <dl class="grid grid-cols-3 gap-3 max-w-[560px] rise rise-1">
      ${stat("充足率", rate, "%")}${stat("公開中", pub.length, "件")}${stat("調整中", live.filter(s=>s.state==="tbd").length, "件")}
    </dl>

    <div class="mt-6 grid lg:grid-cols-2 gap-3.5 max-w-[1000px] rise rise-2">
      ${live.map(sl => {
        const p = phase(sl), pct = Math.min(100, Math.round(sl.people.length / sl.cap * 100));
        return `
        <article class="rounded-2xl bg-white border border-line p-5">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="font-min text-[22px] tnum leading-none tracking-tight">${p === "tbd" ? `${d(sl.date).getMonth()+1}月上旬`
                : `${d(sl.date).getDate()}<span class="text-[13px] text-ink2 ml-1.5">${d(sl.date).getMonth()+1}月 ${dow(sl.date)}</span>`}</p>
              <p class="text-[13.5px] text-ink2 mt-2">${esc(sl.title)}</p>
            </div>${slotPill(sl)}
          </div>
          ${p === "tbd" ? `
            <p class="mt-4 text-[12px] text-muted leading-relaxed">日程が未定でも、空白にせず「調整中」として出しています。</p>
            <button data-act="fix" data-id="${esc(sl.id)}" class="mt-3 w-full py-2.5 rounded-xl border border-line2 text-[13px] hover:border-muted transition-colors">日程を確定する</button>
          ` : `
            <div class="mt-4">
              <div class="flex items-center justify-between text-[11.5px] text-muted">
                <span>応募 <span class="tnum text-ink font-medium">${sl.people.length}</span> / 定員 <span class="tnum">${sl.cap}</span></span>
                <span class="tnum">${pct}%</span>
              </div>
              <div class="mt-2 h-1.5 rounded-full bg-mist overflow-hidden"><div class="h-full bg-moss transition-all duration-500 rounded-full" style="width:${pct}%"></div></div>
              <ul class="mt-4 space-y-2">
                ${sl.people.map(n => { const m = S.members.find(x => x.name === n);
                  return `<li class="flex items-center justify-between gap-3 text-[13px]"><span>${esc(n)}</span>
                    <span class="text-muted text-[11.5px] shrink-0"><span class="tnum">${m?m.count:1}</span>回目 · ${esc(m ? (m.skills.slice(0,2).join("/") || "—") : "初参加")}</span></li>`;
                }).join("") || `<li class="text-[13px] text-muted">まだ応募がありません</li>`}
              </ul>
            </div>`}
          <p class="mt-4 pt-3 border-t border-line text-[11px] text-muted">更新 <span class="tnum">${esc(sl.updated)}</span></p>
        </article>`;
      }).join("")}
    </div>

    <form data-act="slotAdd" class="mt-5 p-5 sm:p-6 rounded-2xl border border-dashed border-line2 max-w-[520px]">
      <p class="text-[14px] font-medium">活動日を追加</p>
      <p class="mt-1.5 text-[12px] text-muted leading-relaxed">2週間前までに立てるのが運用ルールです。立てられない場合も「調整中」として出します。</p>
      <div class="mt-4 grid sm:grid-cols-[1fr_auto] gap-2">
        <input type="date" name="date" value="2026-10-10" class="px-4 py-2.5 rounded-xl border border-line2 bg-white text-[13.5px] outline-none focus:border-moss transition-colors">
        <input name="cap" type="number" min="1" max="30" value="5" aria-label="定員" class="w-full sm:w-24 px-4 py-2.5 rounded-xl border border-line2 bg-white text-[13.5px] outline-none focus:border-moss transition-colors">
      </div>
      <input name="title" placeholder="作業内容（1行）" maxlength="60"
        class="mt-2 w-full px-4 py-2.5 rounded-xl border border-line2 bg-white text-[13.5px] outline-none focus:border-moss transition-colors">
      <button class="mt-3.5 w-full py-3 rounded-xl bg-moss text-snow text-[13.5px] font-medium hover:bg-moss2 transition-colors">追加する</button>
    </form>`;
  return sheet(inner);
}

function viewOpsMembers(){
  const inner = `
    <p class="text-[12.5px] text-ink2 leading-[1.9] max-w-[560px]">参加回数はこの画面にだけ出します。人員を組むのに必要なのは運営だけだからです。</p>
    <ul class="mt-5 max-w-[720px] rounded-2xl bg-white border border-line divide-y divide-line overflow-hidden rise rise-1">
      ${S.members.slice().sort((a, b) => b.count - a.count).map(m => `
        <li class="flex items-center justify-between gap-3 px-5 py-4">
          <div><p class="text-[14px]">${esc(m.name)}</p><p class="text-[11.5px] text-muted mt-1">${esc(m.skills.join(" / ") || "—")}</p></div>
          <div class="text-right shrink-0">
            <p class="font-min text-[22px] tnum leading-none">${m.count}<span class="text-[11.5px] text-muted ml-0.5">回</span></p>
            <p class="text-[11px] text-muted mt-1.5 tnum">${esc(m.last.replace(/-/g, "."))}</p></div>
        </li>`).join("")}
    </ul>`;
  return sheet(inner);
}

const emptyPane = msg => `
  <div class="hidden lg:flex h-full items-center justify-center px-10">
    <div class="text-center max-w-[240px]">
      <svg width="52" height="34" viewBox="0 0 52 34" class="mx-auto text-line2" aria-hidden="true">
        <path d="M1 33 L14 11 L21 21 L30 5 L51 33 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <p class="mt-5 text-[13px] text-muted leading-relaxed">${esc(msg)}</p>
    </div>
  </div>`;

/* 一覧＋詳細（PCは左右、スマホは切り替え） */
function split(listMarkup, detailMarkup, hasSelection){
  if (!DESK()) return hasSelection ? detailMarkup : listMarkup;
  return `
    <div class="flex h-full">
      <div class="w-[390px] xl:w-[430px] shrink-0 border-r border-line overflow-y-auto">${listMarkup}</div>
      <div class="flex-1 min-w-0 overflow-y-auto bg-mist/25">${detailMarkup}</div>
    </div>`;
}

/* ── ナビ・見出し ──────────────────────────── */
/* 図形は viewBox(24) をできるだけ埋める。小さく見える原因は箱ではなく中身の余白だった */
const ICON = {
  activity:'<rect x="1.9" y="3.9" width="20.2" height="18.2" rx="3.2"/><path d="M7.6 1.6v4.6M16.4 1.6v4.6M1.9 9.8h20.2"/>',
  profile: '<circle cx="12" cy="7.2" r="4.6"/><path d="M2.6 22.2c0-4.6 4.2-7.1 9.4-7.1s9.4 2.5 9.4 7.1"/>',
  faq:     '<circle cx="12" cy="12" r="10.1"/><path d="M8.9 8.9a3.1 3.1 0 1 1 3.4 3.05v2.15"/><path d="M12 18.2v.25"/>',
  threads: '<path d="M22.1 14.9a3.4 3.4 0 0 1-3.4 3.4H7.9L1.9 22.6V5.5a3.4 3.4 0 0 1 3.4-3.4h13.4a3.4 3.4 0 0 1 3.4 3.4z"/>'
};
const TABS = {
  volunteer: [["activity","活動"], ["profile","記録"],     ["faq","FAQ"], ["threads","議題"]],
  operator:  [["activity","応募"], ["profile","メンバー"], ["faq","FAQ"], ["threads","議題"]]
};

function heading(){
  const v = S.role === "volunteer";
  if (S.tab === "activity"){
    if (!v) return ["応募状況", "誰が、何人来るかが見えています"];
    if (S.detail && !DESK()) return ["活動の詳細", "確定した情報で決められます"];
    const mine = S.slots.filter(s => s.state !== "done" && joined(s)).sort((a,b)=>d(a.date)-d(b.date));
    return ["次の活動", mine.length ? `${md(mine[0].date)}（${dow(mine[0].date)}）に参加予定です` : "空き枠があります。無理のない範囲で"];
  }
  if (S.tab === "profile") return v ? ["あなたの記録", "毎回の自己紹介は、もう要りません"] : ["メンバー", "参加回数はこの画面にだけ出します"];
  if (S.tab === "faq")     return ["よくある質問", "聞きにくいことほど、ここにあります"];
  if (S.thread && !DESK()) return ["議題", "決まったことが、いちばん上にあります"];
  return ["議題", "決まったことが、いちばん上にあります"];
}

/* ── 描画 ──────────────────────────────────── */
function render(){
  const ops = S.role === "operator";
  document.getElementById("roleLabel").textContent = ops ? "運営として表示" : "参加者として表示";

  const [h, sub] = heading();
  document.getElementById("title").textContent = h;
  document.getElementById("subtitle").textContent = sub;

  let markup;
  if (S.tab === "activity")      markup = ops ? viewOpsActivity() : split(activityList(), activityDetail(), !!S.detail);
  else if (S.tab === "profile")  markup = ops ? viewOpsMembers()  : viewProfile();
  else if (S.tab === "faq")      markup = viewFaq();
  else                           markup = split(threadList(), threadDetail(), !!S.thread);

  const view = document.getElementById("view");
  mount(view, markup);
  view.scrollTop = 0;

  mount(document.getElementById("tabs"), TABS[S.role].map(([k, label]) => {
    const on = S.tab === k;
    return `
    <button data-act="go" data-tab="${k}" aria-current="${on ? "page" : "false"}"
      class="relative flex flex-col items-center justify-center gap-2 pt-4 pb-4 transition-colors ${on ? "text-snow" : "text-haze/70 hover:text-haze"}">
      ${on ? '<span class="absolute top-0 inset-x-0 mx-auto w-10 h-[3px] rounded-b-full bg-moss2"></span>' : ""}
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>
      <span class="text-[13px] leading-none ${on ? "font-medium" : ""}">${label}</span>
    </button>`;
  }).join(""));

  mount(document.getElementById("side"), TABS[S.role].map(([k, label]) => `
    <button data-act="go" data-tab="${k}"
      class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-[13.5px] transition-colors ${
        S.tab===k ? "bg-snow/10 text-snow" : "text-haze/80 hover:text-snow hover:bg-snow/5"}">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>
      ${label}
    </button>`).join(""));

  paintCanvases();
  save();
}

/* ── イベント ──────────────────────────────── */
document.addEventListener("click", e => {
  const el = e.target.closest("button[data-act]");
  if (!el) return;
  const a = el.dataset.act;

  if (a === "go")          { S.tab = el.dataset.tab; S.detail = null; S.thread = null; render(); }
  if (a === "open")        { S.detail = el.dataset.id; S.tab = "activity"; render(); }
  if (a === "back")        { S.detail = null; render(); }
  if (a === "openThread")  { S.thread = el.dataset.id; render(); }
  if (a === "backThread")  { S.thread = null; render(); }
  if (a === "filter")      { filter = el.dataset.k; render(); }

  if (a === "apply") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl && left(sl) > 0 && !joined(sl)) { sl.people.push("あなた"); toast("枠を押さえました"); render(); }
  }
  if (a === "cancel") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl) { const late = !cancelable(sl); sl.people = sl.people.filter(p => p !== "あなた");
              toast(late ? "取り消しました。運営に通知しました" : "取り消しました"); render(); }
  }
  if (a === "fix") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl) { sl.state="open"; sl.meet="折立 6:30"; sl.gear="作業手袋"; sl.updated="8/11"; toast("日程を確定しました"); render(); }
  }
  if (a === "setState") {
    const t = S.threads.find(x => x.id === el.dataset.id), next = el.dataset.s;
    if (t && t.state !== next) {
      t.comments.push({ k:"e", who:who(), at:stamp(), body:`状態を ${ST[t.state].label} → ${ST[next].label} に変更しました` });
      t.state = next; t.updated = stamp(); toast(`状態を「${ST[next].label}」にしました`); render();
    }
  }
  if (a === "newThread") {
    const t = { id:"t"+Date.now(), key:"KUMO-"+(S.threads.length+1), title:"新しい議題", owner:"未定",
                due:"2026-12-31", state:"todo", updated:stamp(), decision:"（まだ決まっていません）", comments:[] };
    S.threads.unshift(t); S.thread = t.id; toast("議題を追加しました"); render();
  }
  if (a === "skillDel") { S.me.skills.splice(Number(el.dataset.i), 1); render(); }
  if (a === "role")     { S.role = S.role === "operator" ? "volunteer" : "operator"; S.detail = null; render(); }
  if (a === "reset")    { localStorage.removeItem(KEY); S = structuredClone(SEED); filter="all"; faqQuery=""; toast("初期状態に戻しました"); render(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-act]");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), a = f.dataset.act;

  if (a === "comment") {
    const t = S.threads.find(x => x.id === f.dataset.id);
    const body = clean(fd.get("body"), 600);
    if (t && body) {
      t.comments.push({ k:"c", who:who(), at:stamp(), body });
      t.updated = stamp(); toast("書き込みました"); render();
    }
  }
  if (a === "skillAdd") {
    const v = clean(fd.get("skill"), 40);
    if (v && !S.me.skills.includes(v)) { S.me.skills.push(v); render(); }
  }
  if (a === "ask") { if (clean(fd.get("q"), 100)) { toast("送りました。誰が聞いたかは残りません"); f.reset(); } }
  if (a === "slotAdd") {
    const date = clean(fd.get("date"), 10), title = clean(fd.get("title"), 60);
    const cap = Math.min(30, Math.max(1, Number(fd.get("cap")) || 5));
    if (/^\d{4}-\d{2}-\d{2}$/.test(date) && title) {
      S.slots.push({ id:"s"+Date.now(), date, title, meet:"折立 6:30", gear:"作業手袋", note:"", cap, people:[], state:"open", updated:"8/11" });
      toast("活動日を追加しました"); render();
    }
  }
});

document.addEventListener("input", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "faqSearch") {
    faqQuery = clean(el.value, 40);
    const pos = el.selectionStart; render();
    const next = document.querySelector('[data-act="faqSearch"]');
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  }
  if (el.dataset.act === "decEdit") {
    const t = S.threads.find(x => x.id === el.dataset.id);
    if (t) { t.decision = clean(el.value, 300); save(); }
  }
});

/* 画面の高さを実測して固定する。
   iOS Safari は 100vh がツールバーを含む高さになり、下端のメニューが画面外に出るため。 */
function setAppHeight(){
  document.documentElement.style.setProperty("--app-h", window.innerHeight + "px");
}
setAppHeight();
addEventListener("resize", setAppHeight);
addEventListener("orientationchange", () => setTimeout(setAppHeight, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", setAppHeight);

window.matchMedia("(min-width:1024px)").addEventListener("change", render);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(paintCanvases, 120); });

render();
</script>
