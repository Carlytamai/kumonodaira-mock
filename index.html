  ]
};

let S = load();
let filter = "all";
let faqQuery = "";
let rxOpen = null;   // リアクション選択パレットを開いているコメント（"tid:idx"）

function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(structuredClone(SEED), JSON.parse(raw)); }
  catch (e) {}
  return structuredClone(SEED);
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ── helpers ───────────────────────────────── */
const DOW = ["日","月","火","水","木","金","土"];
const d      = s => new Date(s + "T00:00:00");
const md     = s => (d(s).getMonth() + 1) + "/" + d(s).getDate();
const dow    = s => DOW[d(s).getDay()];
const jdate  = s => `${d(s).getMonth() + 1}月${d(s).getDate()}日（${dow(s)}）`;
const daysTo = s => Math.round((d(s) - TODAY) / 86400000);
function stamp(){
  const n = new Date();
  return `${TODAY.getMonth() + 1}/${TODAY.getDate()} ${String(n.getHours()).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`;
}
const who = () => S.role === "operator" ? "山本 明彦" : S.me.name;

const joined = sl => sl.people.includes("あなた");
const left   = sl => Math.max(0, sl.cap - sl.people.length);
function phase(sl){
  if (sl.state === "tbd")  return "tbd";
  if (sl.state === "done") return "done";
  return left(sl) === 0 && !joined(sl) ? "full" : "open";
}
const cancelable = sl => daysTo(sl.date) > 7;   // 取り消し期限＝活動日の1週間前

function toast(msg){
  const t = document.getElementById("toast");
  t.firstElementChild.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = "0"; }, 2400);
}

/* 札。全て角丸なし・細罫 */
const TONE = {
  ai:    "border-ai text-ai",
  fill:  "border-ai bg-ai text-white",
  plain: "border-line2 text-ink2",
  mute:  "border-line2 text-muted",
  dash:  "border-dashed border-line2 text-muted"
};
const pill = (label, tone) => `
  <span class="inline-block whitespace-nowrap px-2.5 py-[5px] border ${TONE[tone]} text-[10.5px] tracking-[.18em]">${esc(label)}</span>`;

function slotPill(sl){
  const p = phase(sl);
  if (p === "tbd")  return pill("調整中", "dash");
  if (p === "done") return pill("終了", "mute");
  if (p === "full") return pill("満枠", "mute");
  if (joined(sl))   return pill("参加予定", "fill");
  const n = left(sl);
  return pill(`残り${n}枠`, n <= 2 ? "ai" : "plain");
}
const ST = { todo:{ label:"未対応", tone:"ai" }, doing:{ label:"処理中", tone:"plain" }, done:{ label:"完了", tone:"mute" } };
const statePill = k => pill(ST[k].label, ST[k].tone);

/* 公式サイトの「-お知らせ-」に倣った見出し */
const shead = (jp, en) => `
  <div class="pt-10 pb-8 text-center">
    <h1 class="text-[21px] tracking-[.5em] pl-[.5em]">-${esc(jp)}-</h1>
    <p class="mt-2.5 text-[10px] tracking-[.42em] pl-[.42em] text-muted uppercase">${esc(en)}</p>
  </div>`;

const wrap = inner => `<div class="fade mx-auto w-full max-w-[680px] px-5 sm:px-8 pb-14">${inner}</div>`;

/* ══ 活動：一覧 ═══════════════════════════════ */
function activityList(){
  const live = S.slots.filter(s => s.state !== "done").sort((a, b) => d(a.date) - d(b.date));
  const past = S.slots.filter(s => s.state === "done").sort((a, b) => d(b.date) - d(a.date));
  const counts = { all:live.length, open:live.filter(s=>phase(s)==="open").length,
                   full:live.filter(s=>phase(s)==="full").length, tbd:live.filter(s=>phase(s)==="tbd").length };
  const shown = live.filter(s => filter === "all" || phase(s) === filter);
  const mine  = live.filter(joined);

  const tabBtn = (k, label) => `
    <button data-act="filter" data-k="${k}"
      class="px-1 pb-2.5 text-[12px] tracking-[.16em] whitespace-nowrap border-b transition-colors ${
        filter===k ? "border-ink text-ink" : "border-transparent text-muted hover:text-ink2"}">
      ${label}<span class="ml-1.5 tnum text-[10.5px] ${filter===k?"":"text-line2"}">${counts[k]}</span>
    </button>`;

  const hero = shown[0] ? heroBlock(shown[0]) : "";
  const rest = shown.slice(1);

  return wrap(`
    ${shead("次の活動", "Activity")}
    ${mine.length
      ? `<p class="text-center text-[12px] tracking-[.1em] text-ink2 -mt-3 mb-7">${jdate(mine[0].date)}に参加予定です。</p>`
      : ""}
    <div class="flex justify-center gap-7 border-b border-line">
      ${tabBtn("all","すべて")}${tabBtn("open","空きあり")}${tabBtn("full","満枠")}${tabBtn("tbd","調整中")}
    </div>

    ${shown.length ? `
      <div class="mt-9">${hero}</div>
      ${rest.length ? `
        <p class="mt-12 mb-1 text-[11px] tracking-[.3em] text-muted text-center">そのあとの予定</p>
        <ul>${rest.map(slotRow).join("")}</ul>` : ""}
    ` : `
      <div class="mt-12 py-12 text-center border border-line">
        <p class="text-[13.5px] tracking-[.1em] text-ink2">この条件の予定はありません。</p>
        <button data-act="filter" data-k="all" class="mt-4 text-[12.5px] tracking-[.14em] text-ai border-b border-ai pb-0.5">すべての予定を見る</button>
      </div>`}

    ${past.length ? `
      <details class="mt-12 border-t border-line">
        <summary class="tap flex items-center justify-between py-4 text-[12px] tracking-[.14em] text-muted cursor-pointer list-none">
          <span>過去の記録　<span class="tnum">${past.length}</span></span><span class="text-[11px]">開く</span>
        </summary>
        <ul>${past.map(slotRow).join("")}</ul>
        <p class="py-4 text-[11px] tracking-[.06em] text-muted leading-[2]">終わった活動は畳んでいます。画面の情報量は、時間とともに増えません。</p>
      </details>` : ""}
  `);
}

/* 直近の1件。枠線1本の静かな主役 */
function heroBlock(sl){
  const p = phase(sl), me = joined(sl), tbd = p === "tbd";
  return `
  <section class="border border-ink/70 px-6 sm:px-10 py-9 text-center">
    <p class="text-[11px] tracking-[.3em] text-muted">${tbd ? "次の予定" : daysTo(sl.date) > 0 ? `あと ${daysTo(sl.date)} 日` : "本日"}</p>
    <p class="mt-3 text-[30px] sm:text-[34px] tracking-[.12em] leading-none tnum">
      ${tbd ? `${d(sl.date).getMonth()+1}月上旬` : jdate(sl.date)}
    </p>
    <p class="mt-5 text-[15px] tracking-[.2em]">${esc(sl.title)}</p>
    <div class="mt-4 flex justify-center">${slotPill(sl)}</div>
    ${tbd ? `
      <p class="mt-6 text-[12px] tracking-[.08em] text-muted">日程が決まったら、ここに出ます。</p>
    ` : `
      <p class="mt-5 text-[12px] tracking-[.14em] text-ink2">集合　${esc(sl.meet)}　／　応募 <span class="tnum">${sl.people.length}</span>・定員 <span class="tnum">${sl.cap}</span>名</p>
      <button data-act="open" data-id="${esc(sl.id)}"
        class="mt-7 w-full sm:w-[320px] py-3.5 bg-ink text-white text-[13px] tracking-[.4em] pl-[.4em] hover:bg-ai transition-colors">
        ${me ? "詳細を見る" : p === "full" ? "詳細を見る" : "詳細を見て、枠を押さえる"}</button>`}
  </section>`;
}

function slotRow(sl){
  const p = phase(sl);
  const dim = (p === "done" || p === "full") ? "opacity-50" : "";
  const ok = p !== "tbd";
  return `
  <li class="border-b border-line">
    <button data-act="${ok ? "open" : "noop"}" data-id="${esc(sl.id)}"
      class="tap w-full text-left py-5 flex items-center gap-5 ${dim} ${ok?"hover:bg-wash":"cursor-default"} transition-colors">
      <span class="shrink-0 w-[64px] text-center">
        ${p === "tbd"
          ? `<span class="text-[13px] tracking-[.1em] leading-tight block">${d(sl.date).getMonth()+1}月<br>上旬</span>`
          : `<span class="text-[24px] leading-none tnum block">${d(sl.date).getDate()}</span>
             <span class="text-[10.5px] tracking-[.2em] text-muted block mt-1.5">${d(sl.date).getMonth()+1}月・${dow(sl.date)}</span>`}
      </span>
      <span class="flex-1 min-w-0">
        <span class="block text-[14px] tracking-[.12em] truncate">${esc(sl.title)}</span>
        ${sl.meet ? `<span class="block text-[11px] tracking-[.1em] text-muted mt-1">集合　${esc(sl.meet)}</span>` : ""}
      </span>
      <span class="shrink-0">${slotPill(sl)}</span>
    </button>
  </li>`;
}

/* ══ 活動：詳細 ═══════════════════════════════ */
function activityDetail(){
  const sl = S.slots.find(s => s.id === S.detail);
  if (!sl) { S.detail = null; return activityList(); }
  const p = phase(sl), me = joined(sl);
  const next = S.slots.filter(s => s.id !== sl.id && phase(s) === "open").sort((a,b)=>d(a.date)-d(b.date))[0];

  let action;
  if (p === "done") {
    action = `<div class="mt-9 py-3.5 text-center text-[12.5px] tracking-[.2em] text-muted border border-line">終了した活動です</div>`;
  } else if (me) {
    action = `
      <button data-act="cancel" data-id="${esc(sl.id)}" class="mt-9 w-full py-3.5 border border-ink text-[13px] tracking-[.4em] pl-[.4em] hover:bg-wash transition-colors">枠を取り消す</button>
      <p class="mt-3.5 text-center text-[11.5px] tracking-[.06em] text-muted leading-[1.9]">
        ${cancelable(sl) ? "活動日の1週間前まで、いつでも取り消せます。"
                         : "期限を過ぎています。取り消すと運営に通知が届きます。個別の連絡は不要です。"}</p>`;
  } else if (p === "full") {
    action = `
      <div class="mt-9 py-3.5 text-center text-[12.5px] tracking-[.2em] text-muted border border-line">満枠です</div>
      ${next ? `<button data-act="open" data-id="${esc(next.id)}" class="mt-3 w-full py-3.5 bg-ink text-white text-[13px] tracking-[.2em] hover:bg-ai transition-colors">
        次に空きがある ${jdate(next.date)} を見る</button>` : ""}`;
  } else {
    action = `
      <button data-act="apply" data-id="${esc(sl.id)}"
        class="mt-9 w-full py-4 bg-ink text-white text-[13.5px] tracking-[.5em] pl-[.5em] hover:bg-ai transition-colors">枠を押さえる</button>
      <p class="mt-3.5 text-center text-[11.5px] tracking-[.1em] text-muted">1週間前まで、いつでも取り消せます。</p>`;
  }

  const row = (k, v) => v ? `
    <div class="flex gap-6 py-4 border-b border-line">
      <dt class="w-[4.2em] shrink-0 text-[12px] tracking-[.3em] text-muted pt-0.5">${k}</dt>
      <dd class="text-[13.5px] tracking-[.08em] leading-[1.9]">${v}</dd>
    </div>` : "";

  return wrap(`
    <div class="pt-7">
      <button data-act="back" class="text-[11.5px] tracking-[.2em] text-muted hover:text-ink transition-colors">← 一覧へ</button>
    </div>
    <div class="pt-8 pb-2 text-center">
      <p class="text-[11px] tracking-[.3em] text-muted">${daysTo(sl.date) > 0 ? `あと ${daysTo(sl.date)} 日` : "本日"}</p>
      <h1 class="mt-3 text-[30px] sm:text-[34px] tracking-[.12em] tnum">${jdate(sl.date)}</h1>
      <p class="mt-4 text-[15px] tracking-[.2em]">${esc(sl.title)}</p>
      <div class="mt-4 flex justify-center">${slotPill(sl)}</div>
    </div>

    <dl class="mt-7 border-t border-line">
      ${row("集合", esc(sl.meet))}
      ${row("持ち物", esc(sl.gear))}
      ${row("定員", `<span class="tnum">${sl.cap}名</span><span class="text-muted">　／　応募 <span class="tnum">${sl.people.length}名</span></span>`)}
    </dl>

    ${sl.note ? `<p class="mt-7 px-5 py-4 border border-line text-[12.5px] tracking-[.06em] leading-[2] text-ink2">${esc(sl.note)}</p>` : ""}

    ${action}

    <p class="mt-10 pt-5 border-t border-line text-[11px] tracking-[.08em] text-muted leading-[2]">
      更新 <span class="tnum">${esc(sl.updated)}</span>　—　誰が応募しているかは表示していません。参加歴で気後れしないためです。
    </p>
  `);
}

/* ══ 記録 ═════════════════════════════════════ */

/* ══ 議題：一覧 ═══════════════════════════════ */
function threadList(){
  const order = { todo:0, doing:1, done:2 };
  const open = S.threads.filter(t => t.state !== "done").sort((a,b)=>order[a.state]-order[b.state]);
  const done = S.threads.filter(t => t.state === "done");

  return wrap(`
    ${shead("議題", "Threads")}
    <p class="text-[12px] tracking-[.1em] text-ink2 text-center -mt-3 mb-8">議題ごとに文脈を閉じています。決まったことは、常にいちばん上にあります。</p>

    ${S.role === "operator" ? `
      <p class="text-center mb-8"><button data-act="newThread" class="px-8 py-3 bg-ink text-white text-[12.5px] tracking-[.4em] pl-[.4em] hover:bg-ai transition-colors">議題を追加</button></p>` : ""}

    <ul class="border-t border-line">${open.map(threadRow).join("")}</ul>

    ${done.length ? `
      <details class="mt-10">
        <summary class="tap flex items-center justify-between py-4 text-[12px] tracking-[.14em] text-muted cursor-pointer list-none border-b border-line">
          <span>完了した議題　<span class="tnum">${done.length}</span></span><span class="text-[11px]">開く</span>
        </summary>
        <ul>${done.map(threadRow).join("")}</ul>
      </details>` : ""}
  `);
}

function threadRow(t){
  const dim = t.state === "done" ? "opacity-50" : "";
  const last = t.comments[t.comments.length - 1];
  const n = t.comments.filter(c=>c.k==="c").length;
  const rxTotal = t.comments.reduce((a,c)=> a + (c.rx ? Object.values(c.rx).reduce((x,y)=>x+y.length,0) : 0), 0);
  return `
  <li class="border-b border-line">
    <button data-act="openThread" data-id="${esc(t.id)}"
      class="w-full text-left py-6 px-1 ${dim} hover:bg-wash transition-colors">
      <div class="flex items-start justify-between gap-4">
        <p class="text-[15px] tracking-[.14em] leading-[1.7]">${esc(t.title)}</p>
        <span class="shrink-0 mt-0.5">${statePill(t.state)}</span>
      </div>
      <p class="mt-2.5 text-[10.5px] tracking-[.16em] text-muted">
        <span class="tnum">${esc(t.key)}</span>　${esc(t.owner)}　期限 <span class="tnum">${md(t.due)}</span>　会話 <span class="tnum">${n}</span>${rxTotal ? `　リアクション <span class="tnum">${rxTotal}</span>` : ""}
      </p>
      ${last ? `<p class="mt-2 text-[12px] tracking-[.06em] text-ink2/70 truncate">${esc(last.body)}</p>` : ""}
    </button>
  </li>`;
}

/* ══ 議題：詳細＋会話＋リアクション ═══════════ */
function threadDetail(){
  const t = S.threads.find(x => x.id === S.thread);
  if (!t) { S.thread = null; return threadList(); }
  const ops = S.role === "operator";

  const stateCtl = ops ? `
    <div class="flex justify-center gap-2">
      ${Object.entries(ST).map(([k, v]) => `
        <button data-act="setState" data-id="${esc(t.id)}" data-s="${k}"
          class="px-4 py-[7px] border text-[11px] tracking-[.2em] transition-colors ${
            t.state===k ? "border-ink bg-ink text-white" : "border-line2 text-muted hover:border-ink hover:text-ink"}">${v.label}</button>`).join("")}
    </div>` : `<div class="flex justify-center">${statePill(t.state)}</div>`;

  return wrap(`
    <div class="pt-7">
      <button data-act="backThread" class="text-[11.5px] tracking-[.2em] text-muted hover:text-ink transition-colors">← 議題一覧へ</button>
    </div>

    <div class="pt-8 text-center">
      <p class="text-[10.5px] tracking-[.3em] text-muted tnum">${esc(t.key)}</p>
      <h1 class="mt-2.5 text-[23px] tracking-[.2em] leading-[1.6]">${esc(t.title)}</h1>
      <div class="mt-5">${stateCtl}</div>
      <p class="mt-4 text-[11px] tracking-[.16em] text-muted">担当　${esc(t.owner)}　／　期限 <span class="tnum">${md(t.due)}</span>　／　更新 <span class="tnum">${esc(t.updated)}</span></p>
    </div>

    <!-- 決定事項：常に最上部・これだけが正 -->
    <section class="mt-9 border border-ink/70 px-6 py-6">
      <p class="text-[11px] tracking-[.4em] pl-[.4em] text-center">決定事項</p>
      ${ops
        ? `<textarea data-act="decEdit" data-id="${esc(t.id)}" rows="3" maxlength="300"
             class="mt-4 w-full bg-transparent text-[14px] tracking-[.08em] leading-[2.1] text-center outline-none resize-none border-b border-dashed border-line2 focus:border-ink transition-colors">${esc(t.decision)}</textarea>
           <p class="mt-2 text-[10px] tracking-[.2em] text-muted text-center">編集できます</p>`
        : `<p class="mt-4 text-[14px] tracking-[.08em] leading-[2.1] text-center pre">${esc(t.decision)}</p>`}
      <p class="mt-4 text-[10.5px] tracking-[.08em] text-muted text-center">下の会話が全部流れても、ここだけで用が足りるようにしています。</p>
    </section>

    <!-- 会話 -->
    <div class="mt-12 flex items-center gap-4">
      <span class="h-px flex-1 bg-line"></span>
      <span class="text-[11px] tracking-[.4em] pl-[.4em] text-muted">会話　<span class="tnum">${t.comments.filter(c=>c.k==="c").length}</span></span>
      <span class="h-px flex-1 bg-line"></span>
    </div>

    <ol class="mt-8 space-y-8">
      ${t.comments.map((c, i) => commentItem(t, c, i)).join("")}
    </ol>

    <!-- 投稿 -->
    <form data-act="comment" data-id="${esc(t.id)}" class="mt-12 border border-line px-5 sm:px-6 py-6">
      <p class="text-[11px] tracking-[.2em] text-muted">${esc(who())} として書き込む</p>
      <textarea name="body" rows="3" maxlength="600" placeholder="この議題について書く"
        class="mt-3.5 w-full px-3.5 py-3 border border-line2 bg-white text-[13.5px] tracking-[.06em] leading-[2] outline-none focus:border-ink transition-colors resize-y"></textarea>
      <div class="mt-4 flex items-center justify-between gap-4">
        <p class="text-[10.5px] tracking-[.08em] text-muted">全体への周知はMessengerのままです。</p>
        <button class="px-7 py-2.5 bg-ink text-white text-[12.5px] tracking-[.4em] pl-[.4em] hover:bg-ai transition-colors shrink-0">書き込む</button>
      </div>
    </form>
  `);
}

function commentItem(t, c, idx){
  if (c.k === "e") return `
    <li class="text-center text-[10.5px] tracking-[.12em] text-muted leading-[2]">
      -　${esc(c.body)}　<span class="tnum">${esc(c.at)}</span>　-
    </li>`;

  const rx = c.rx || {};
  const meName = who();
  const openKey = `${t.id}:${idx}`;
  const chips = RX.filter(e => rx[e] && rx[e].length).map(e => {
    const mine = rx[e].includes(meName);
    return `<button data-act="rx" data-id="${esc(t.id)}" data-ci="${idx}" data-e="${esc(e)}"
      title="${esc(rx[e].join("、"))}"
      class="inline-flex items-center gap-1.5 px-2.5 py-[5px] border text-[12px] transition-colors ${
        mine ? "border-ink bg-ink text-white" : "border-line2 hover:border-ink"}">
      <span>${esc(e)}</span><span class="tnum text-[11px]">${rx[e].length}</span></button>`;
  }).join("");

  const palette = rxOpen === openKey ? `
    <span class="inline-flex items-center gap-1 border border-line2 px-1.5 py-[3px]">
      ${RX.map(e => `<button data-act="rx" data-id="${esc(t.id)}" data-ci="${idx}" data-e="${esc(e)}"
        class="px-1.5 py-0.5 text-[14px] hover:bg-wash transition-colors" aria-label="${esc(e)}でリアクション">${esc(e)}</button>`).join("")}
    </span>` : `
    <button data-act="rxOpen" data-k="${esc(openKey)}" aria-label="リアクションを追加"
      class="inline-flex items-center px-2.5 py-[5px] border border-line2 text-[12px] text-muted hover:border-ink hover:text-ink transition-colors">＋</button>`;

  return `
  <li>
    <div class="flex items-baseline justify-between gap-4 border-b border-line pb-2">
      <span class="text-[13px] tracking-[.2em]">${esc(c.who)}</span>
      <span class="text-[10.5px] tracking-[.14em] text-muted tnum shrink-0">${esc(c.at)}</span>
    </div>
    <p class="mt-3.5 text-[13.5px] tracking-[.06em] leading-[2.15] text-ink2 pre">${esc(c.body)}</p>
    <div class="mt-3.5 flex flex-wrap items-center gap-2">${chips}${palette}</div>
  </li>`;
}

/* ══ 運営ビュー ═══════════════════════════════ */
function viewOpsActivity(){
  const live = S.slots.filter(s => s.state !== "done").sort((a, b) => d(a.date) - d(b.date));
  const pub  = live.filter(s => s.state === "open");
  const capSum = pub.reduce((a, s) => a + s.cap, 0);
  const rate = capSum ? Math.round(pub.reduce((a, s) => a + s.people.length, 0) / capSum * 100) : 0;

  return wrap(`
    ${shead("応募状況", "Operations")}

    <dl class="flex justify-center gap-12 sm:gap-16 text-center border-y border-line py-6">
      ${[["充足率", rate + "%"], ["公開中", pub.length + "件"], ["調整中", live.filter(s=>s.state==="tbd").length + "件"]].map(([k,v]) => `
        <div><dt class="text-[10.5px] tracking-[.3em] text-muted">${k}</dt><dd class="mt-2 text-[26px] tnum tracking-[.06em]">${v}</dd></div>`).join("")}
    </dl>

    <div class="mt-10 space-y-8">
      ${live.map(sl => {
        const p = phase(sl), pct = Math.min(100, Math.round(sl.people.length / sl.cap * 100));
        return `
        <article class="border border-line px-5 sm:px-7 py-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="text-[17px] tracking-[.12em] tnum">${p === "tbd" ? `${d(sl.date).getMonth()+1}月上旬` : jdate(sl.date)}</p>
              <p class="mt-1.5 text-[12.5px] tracking-[.1em] text-ink2">${esc(sl.title)}</p>
            </div>${slotPill(sl)}
          </div>
          ${p === "tbd" ? `
            <p class="mt-4 text-[11.5px] tracking-[.06em] text-muted leading-[1.9]">日程が未定でも、空白にせず「調整中」として出しています。</p>
            <button data-act="fix" data-id="${esc(sl.id)}" class="mt-4 w-full py-3 border border-ink text-[12px] tracking-[.3em] pl-[.3em] hover:bg-wash transition-colors">日程を確定する</button>
          ` : `
            <div class="mt-5">
              <div class="flex items-center justify-between text-[11px] tracking-[.14em] text-muted">
                <span>応募 <span class="tnum text-ink">${sl.people.length}</span>　／　定員 <span class="tnum">${sl.cap}</span></span>
                <span class="tnum">${pct}%</span>
              </div>
              <div class="mt-2.5 h-[3px] bg-line"><div class="h-full bg-ai transition-all duration-500" style="width:${pct}%"></div></div>
              <ul class="mt-5 space-y-2.5">
                ${sl.people.map(n => { const m = S.members.find(x => x.name === n);
                  return `<li class="flex items-center justify-between gap-4 text-[12.5px] tracking-[.1em]"><span>${esc(n)}</span>
                    <span class="text-muted text-[11px] tracking-[.08em] shrink-0"><span class="tnum">${m?m.count:1}</span>回目　${esc(m ? (m.skills.slice(0,2).join("・") || "—") : "初参加")}</span></li>`;
                }).join("") || `<li class="text-[12px] tracking-[.1em] text-muted">まだ応募がありません</li>`}
              </ul>
            </div>`}
          <p class="mt-5 pt-4 border-t border-line text-[10.5px] tracking-[.2em] text-muted">更新 <span class="tnum">${esc(sl.updated)}</span></p>
        </article>`;
      }).join("")}
    </div>

    <form data-act="slotAdd" class="mt-10 border border-dashed border-line2 px-5 sm:px-7 py-6">
      <p class="text-[13px] tracking-[.3em] pl-[.3em] text-center">活動日を追加</p>
      <p class="mt-2.5 text-[11px] tracking-[.06em] text-muted text-center leading-[1.9]">2週間前までに立てるのが運用ルールです。立てられない場合も「調整中」として出します。</p>
      <div class="mt-5 grid sm:grid-cols-[1fr_92px] gap-2">
        <input type="date" name="date" value="2026-10-10" class="px-3.5 py-2.5 border border-line2 bg-white text-[12.5px] tracking-[.06em] outline-none focus:border-ink transition-colors">
        <input name="cap" type="number" min="1" max="30" value="5" aria-label="定員" class="px-3.5 py-2.5 border border-line2 bg-white text-[12.5px] outline-none focus:border-ink transition-colors">
      </div>
      <input name="title" placeholder="作業内容（1行）" maxlength="60"
        class="mt-2 w-full px-3.5 py-2.5 border border-line2 bg-white text-[12.5px] tracking-[.06em] outline-none focus:border-ink transition-colors">
      <button class="mt-4 w-full py-3 bg-ink text-white text-[12.5px] tracking-[.4em] pl-[.4em] hover:bg-ai transition-colors">追加する</button>
    </form>
  `);
}

function viewOpsMembers(){
  return wrap(`
    ${shead("メンバー", "Members")}
    <p class="text-[12px] tracking-[.1em] text-ink2 text-center -mt-3 mb-8">参加回数はこの画面にだけ出します。人員を組むのに必要なのは運営だけだからです。</p>
    <ul class="border-t border-line">
      ${S.members.slice().sort((a, b) => b.count - a.count).map(m => `
        <li class="flex items-center justify-between gap-5 py-5 border-b border-line px-1">
          <div>
            <p class="text-[14px] tracking-[.16em]">${esc(m.name)}</p>
            <p class="mt-1.5 text-[11px] tracking-[.1em] text-muted">${esc(m.skills.join("・") || "—")}</p>
          </div>
          <div class="text-right shrink-0">
            <p class="text-[19px] tnum tracking-[.06em]">${m.count}<span class="text-[11px] tracking-[.1em] text-muted ml-1">回</span></p>
            <p class="mt-1 text-[10.5px] tracking-[.14em] text-muted tnum">${esc(m.last.replace(/-/g, "."))}</p>
          </div>
        </li>`).join("")}
    </ul>
  `);
}

/* ── ナビ ──────────────────────────────────── */
const ICON = {
  activity:'<rect x="1.9" y="3.9" width="20.2" height="18.2"/><path d="M7.6 1.6v4.6M16.4 1.6v4.6M1.9 9.8h20.2"/>',
  profile: '<circle cx="12" cy="7.2" r="4.6"/><path d="M2.6 22.2c0-4.6 4.2-7.1 9.4-7.1s9.4 2.5 9.4 7.1"/>',
  faq:     '<circle cx="12" cy="12" r="10.1"/><path d="M8.9 8.9a3.1 3.1 0 1 1 3.4 3.05v2.15"/><path d="M12 18.2v.25"/>',
  threads: '<path d="M22.1 14.9a3.4 3.4 0 0 1-3.4 3.4H7.9L1.9 22.6V5.5a3.4 3.4 0 0 1 3.4-3.4h13.4a3.4 3.4 0 0 1 3.4 3.4z"/>'
};
const TABS = {
  volunteer: [["activity", "活動"], ["profile", "記録"],     ["faq", "FAQ"], ["threads", "議題"]],
  operator:  [["activity", "応募"], ["profile", "メンバー"], ["faq", "FAQ"], ["threads", "議題"]]
};

/* ── 描画 ──────────────────────────────────── */
function render(){
  const ops = S.role === "operator";
  document.getElementById("roleLabel").textContent = ops ? "運営として表示" : "参加者として表示";

  let markup;
  if (S.tab === "activity")      markup = ops ? viewOpsActivity() : (S.detail ? activityDetail() : activityList());
  else if (S.tab === "profile")  markup = ops ? viewOpsMembers()  : viewProfile();
  else if (S.tab === "faq")      markup = viewFaq();
  else                           markup = S.thread ? threadDetail() : threadList();

  const view = document.getElementById("view");
  mount(view, markup);
  view.scrollTop = 0;

  mount(document.getElementById("pcnav"), TABS[S.role].map(([k, label]) => `
    <button data-act="go" data-tab="${k}"
      class="py-3.5 text-[12.5px] tracking-[.4em] pl-[.4em] border-b-2 transition-colors ${
        S.tab===k ? "border-ink text-ink" : "border-transparent text-muted hover:text-ink"}">${label}</button>`).join(""));

  mount(document.getElementById("tabs"), TABS[S.role].map(([k, label]) => {
    const on = S.tab === k;
    return `
    <button data-act="go" data-tab="${k}" aria-current="${on ? "page" : "false"}"
      class="relative flex flex-col items-center justify-center gap-1.5 pt-4 pb-3.5 transition-colors ${on ? "text-ink" : "text-muted hover:text-ink2"}">
      ${on ? '<span class="absolute top-0 inset-x-0 mx-auto w-10 h-[2px] bg-ink"></span>' : ""}
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>
      <span class="text-[11px] tracking-[.3em] pl-[.3em]">${label}</span>
    </button>`;
  }).join(""));

  save();
}

/* ── イベント ──────────────────────────────── */
document.addEventListener("click", e => {
  const el = e.target.closest("button[data-act]");
  if (!el) return;
  const a = el.dataset.act;

  if (a === "go")          { S.tab = el.dataset.tab; S.detail = null; S.thread = null; rxOpen = null; render(); }
  if (a === "open")        { S.detail = el.dataset.id; S.tab = "activity"; render(); }
  if (a === "back")        { S.detail = null; render(); }
  if (a === "openThread")  { S.thread = el.dataset.id; rxOpen = null; render(); }
  if (a === "backThread")  { S.thread = null; rxOpen = null; render(); }
  if (a === "filter")      { filter = el.dataset.k; render(); }

  if (a === "apply") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl && left(sl) > 0 && !joined(sl)) { sl.people.push("あなた"); toast("枠を押さえました"); render(); }
  }
  if (a === "cancel") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl) { const late = !cancelable(sl); sl.people = sl.people.filter(p => p !== "あなた");
              toast(late ? "取り消しました。運営に通知しました" : "取り消しました"); render(); }
  }
  if (a === "fix") {
    const sl = S.slots.find(s => s.id === el.dataset.id);
    if (sl) { sl.state="open"; sl.meet="折立 6:30"; sl.gear="作業手袋"; sl.updated="8/11"; toast("日程を確定しました"); render(); }
  }
  if (a === "setState") {
    const t = S.threads.find(x => x.id === el.dataset.id), next = el.dataset.s;
    if (t && ST[next] && t.state !== next) {
      t.comments.push({ k:"e", who:who(), at:stamp(), body:`状態を ${ST[t.state].label} → ${ST[next].label} に変更しました` });
      t.state = next; t.updated = stamp(); toast(`状態を「${ST[next].label}」にしました`); render();
    }
  }
  if (a === "newThread") {
    const t = { id:"t"+Date.now(), key:"KUMO-"+(S.threads.length+1), title:"新しい議題", owner:"未定",
                due:"2026-12-31", state:"todo", updated:stamp(), decision:"（まだ決まっていません）", comments:[] };
    S.threads.unshift(t); S.thread = t.id; toast("議題を追加しました"); render();
  }

  /* リアクション */
  if (a === "rxOpen") { rxOpen = rxOpen === el.dataset.k ? null : el.dataset.k; render(); }
  if (a === "rx") {
    const t = S.threads.find(x => x.id === el.dataset.id);
    const c = t && t.comments[Number(el.dataset.ci)];
    const emo = el.dataset.e;
    if (t && c && c.k === "c" && RX.includes(emo)) {
      c.rx = c.rx || {};
      const list = c.rx[emo] = c.rx[emo] || [];
      const me = who();
      const i = list.indexOf(me);
      if (i >= 0) { list.splice(i, 1); if (!list.length) delete c.rx[emo]; }
      else list.push(me);
      rxOpen = null;
      save(); render();
    }
  }

  if (a === "skillDel") { S.me.skills.splice(Number(el.dataset.i), 1); render(); }
  if (a === "role")     { S.role = S.role === "operator" ? "volunteer" : "operator"; S.detail = null; rxOpen = null; render(); }
  if (a === "reset")    { localStorage.removeItem(KEY); S = structuredClone(SEED); filter="all"; faqQuery=""; rxOpen=null; toast("初期状態に戻しました"); render(); }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-act]");
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f), a = f.dataset.act;

  if (a === "comment") {
    const t = S.threads.find(x => x.id === f.dataset.id);
    const body = clean(fd.get("body"), 600);
    if (t && body) {
      t.comments.push({ k:"c", who:who(), at:stamp(), body, rx:{} });
      t.updated = stamp(); toast("書き込みました"); render();
    }
  }
  if (a === "skillAdd") {
    const v = clean(fd.get("skill"), 40);
    if (v && !S.me.skills.includes(v)) { S.me.skills.push(v); render(); }
  }
  if (a === "ask") { if (clean(fd.get("q"), 100)) { toast("送りました。誰が聞いたかは残りません"); f.reset(); } }
  if (a === "slotAdd") {
    const date = clean(fd.get("date"), 10), title = clean(fd.get("title"), 60);
    const cap = Math.min(30, Math.max(1, Number(fd.get("cap")) || 5));
    if (/^\d{4}-\d{2}-\d{2}$/.test(date) && title) {
      S.slots.push({ id:"s"+Date.now(), date, title, meet:"折立 6:30", gear:"作業手袋", note:"", cap, people:[], state:"open", updated:"8/11" });
      toast("活動日を追加しました"); render();
    }
  }
});

document.addEventListener("input", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "faqSearch") {
    faqQuery = clean(el.value, 40);
    const pos = el.selectionStart; render();
    const next = document.querySelector('[data-act="faqSearch"]');
    if (next) { next.focus(); next.setSelectionRange(pos, pos); }
  }
  if (el.dataset.act === "decEdit") {
    const t = S.threads.find(x => x.id === el.dataset.id);
    if (t) { t.decision = clean(el.value, 300); save(); }
  }
});

/* 画面の高さを実測して固定する。
   iOS Safari は 100vh がツールバーを含む高さになり、下端のメニューが画面外に出るため。 */
function setAppHeight(){
  document.documentElement.style.setProperty("--app-h", window.innerHeight + "px");
}
setAppHeight();
addEventListener("resize", setAppHeight);
addEventListener("orientationchange", () => setTimeout(setAppHeight, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", setAppHeight);

render();
</script>
